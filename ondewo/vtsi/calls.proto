syntax = "proto3";

package ondewo.vtsi;
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "ondewo/nlu/context.proto";
import "ondewo/nlu/intent.proto";
import "ondewo/s2t/speech-to-text.proto";
import "ondewo/t2s/text-to-speech.proto";
import "ondewo/sip/sip.proto";
import "ondewo/vtsi/campaigns.proto";


// <p>ONDEWO VTSI API</p>
service Calls {

    //////////////////////////////////////////////////////////////////////////////
    // Caller and Listener endpoints
    //////////////////////////////////////////////////////////////////////////////

    // <p>Start single caller instance for a specific nlu-project.</p>
    rpc StartCaller (StartCallerRequest) returns (StartCallerResponse);

    // <p>Start multiple ondewo-sip callers instances for a specific nlu-project.</p>
    rpc StartCallers (StartCallersRequest) returns (StartCallersResponse);

    // <p>Lists all available callers</p>
    rpc ListCallers (ListCallersRequest) returns (ListCallersResponse);

    // <p>Gets a caller</p>
    rpc GetCaller (GetCallerRequest) returns (Caller);

    // <p>Deletes a caller</p>
    rpc DeleteCaller (DeleteCallerRequest) returns (DeleteCallerResponse);

    // <p>Deletes multiple callers</p>
    rpc DeleteCallers (DeleteCallersRequest) returns (DeleteCallersResponse);

    // <p>Stops a caller</p>
    rpc StopCaller (StopCallerRequest) returns (StopCallerResponse);

    // <p>Stops multiple callers</p>
    rpc StopCallers (StopCallersRequest) returns (StopCallersResponse);

    // <p>Start single listener instance for a specific nlu-project.</p>
    rpc StartListener (StartListenerRequest) returns (StartListenerResponse);

    // <p>Start multiple ondewo-sip listeners instances for a specific nlu-project.</p>
    rpc StartListeners (StartListenersRequest) returns (StartListenersResponse);

    // <p>Stop a ondewo-sip listeners instances for a specific nlu-project.</p>
    rpc StopListener (StopListenerRequest) returns (StopListenerResponse);

    // <p>Stop multiple ondewo-sip listeners instances for a specific nlu-project.</p>
    rpc StopListeners (StopListenersRequest) returns (StopListenersResponse);

    // <p>Lists all available listeners</p>
    rpc ListListeners (ListListenersRequest) returns (ListListenersResponse);

    // <p>Gets a listener</p>
    rpc GetListener (GetListenerRequest) returns (Listener);

    // <p>Deletes a listener</p>
    rpc DeleteListener (DeleteListenerRequest) returns (DeleteListenerResponse);

    // <p>Deletes multiple listeners</p>
    rpc DeleteListeners (DeleteListenersRequest) returns (DeleteListenersResponse);

    // <p>Start a single ondewo-sip caller instance at a scheduled time</p>
    rpc StartScheduledCaller (StartScheduledCallerRequest) returns (StartScheduledCallerResponse);

    // <p>Start multiple ondewo-sip caller instances, each at its own scheduled time</p>
    rpc StartScheduledCallers (StartScheduledCallersRequest) returns (StartScheduledCallersResponse);

    // <p>Adds callers to a campaign instead of starting them. The campaign then starts them, at most
    // <code>max_parallel_calls</code> at a time. The request is atomic: either the campaign (when new), every
    // campaign call is stored, or nothing is. Errors are gRPC status codes (see <code>CampaignAssignment</code>).</p>
    // <p>Rolling updates: a VTSI server that predates this RPC answers <code>UNIMPLEMENTED</code> and starts
    // nothing. Do not fall back to <code>StartCallers</code> on <code>UNIMPLEMENTED</code>; retry later.</p>
    rpc AddCallersToCampaign (AddCallersToCampaignRequest) returns (AddCallersToCampaignResponse);

    // <p>Adds scheduled callers to a campaign: each fires at or after its scheduled time AND when the campaign has a
    // free slot, and follows the campaign&apos;s retries, stop and hard stop. Same atomicity, errors and rolling-update
    // behaviour as <code>AddCallersToCampaign</code>.</p>
    rpc AddScheduledCallersToCampaign (AddScheduledCallersToCampaignRequest) returns (AddScheduledCallersToCampaignResponse);

    // <p>Gets a scheduled caller</p>
    rpc GetScheduledCaller (GetScheduledCallerRequest) returns (ScheduledCaller);

    // <p>Lists the scheduled callers of a vtsi-project</p>
    rpc ListScheduledCallers (ListScheduledCallersRequest) returns (ListScheduledCallersResponse);

    // <p>Cancels a scheduled caller that has not fired yet</p>
    // <p>A scheduled caller of a campaign can be cancelled while its campaign call is
    // <code>CAMPAIGN_CALL_STATE_NOT_STARTED</code> or <code>CAMPAIGN_CALL_STATE_RETRY_PENDING</code>;
    // the campaign call then becomes <code>CAMPAIGN_CALL_STATE_CANCELLED</code>. While an attempt is
    // <code>DISPATCHING</code> or <code>IN_PROGRESS</code> the request is refused:
    // <code>cancelled = false</code> and the scheduled caller keeps its status.</p>
    rpc CancelScheduledCaller (CancelScheduledCallerRequest) returns (CancelScheduledCallerResponse);

    // <p>Stop/kill a ondewo-sip listener or caller instance for a specific vtsi-project.</p>
    rpc StopCall (StopCallRequest) returns (StopCallResponse);

    // <p>Stop/kill a list of ondewo-sip listener or caller instances for a specific vtsi-project.</p>
    // <p>Stops both Listener and Caller calls</p>
    rpc StopCalls (StopCallsRequest) returns (StopCallsResponse);

    // <p>Stop/kill all ondewo-sip listener or caller instance for a specific nlu-project.</p>
    // <p>Stops all Listener and Caller calls</p>
    rpc StopAllCalls (StopAllCallsRequest) returns (StopCallsResponse);

    // <p>Transfer a call to a phone number, a softphone account, another listener or the listener queue.</p>
    // <p>The target is either the typed <code>target</code> or the legacy raw <code>transfer_id</code>, never both. It is
    // resolved and validated before anything is sent; an invalid target is answered with
    // <code>TRANSFER_OUTCOME_TARGET_INVALID</code> and an <code>error_reason</code>, and the call is untouched.</p>
    // <p><code>TRANSFER_MODE_BLIND</code> (default) sends a SIP REFER and reports its outcome: a refused REFER keeps the
    // call with the bot. <code>TRANSFER_MODE_WARM</code> rings the target into the call first, and the bot leaves only
    // after the target joined (Asterisk 22 only).</p>
    // <p>Telephony outcomes (busy, no answer, REFER rejected) are successful RPCs carrying an <code>outcome</code>.
    // Refusals before any side effect also return a gRPC status with <code>reason=&lt;token&gt;</code> in its details:
    // <code>INVALID_ARGUMENT</code> (both targets set, malformed target), <code>NOT_FOUND</code> (call or target not
    // found, including another project&apos;s), <code>FAILED_PRECONDITION</code> (<code>call-not-connected</code>,
    // <code>amd-in-progress</code>, <code>call-not-yet-identified</code>, <code>participants-present</code>,
    // <code>asterisk-version-unsupported</code>, <code>sip-image-too-old</code>), <code>ABORTED</code>
    // (<code>transfer-in-progress</code>), <code>UNAVAILABLE</code> (<code>sip-unreachable</code>).</p>
    // <p>Authorization: requires the role <code>PROJECT_DEVELOPER</code> or higher on the project, and the server&apos;s
    // Keycloak auth mode <code>ENFORCE</code>; otherwise <code>PERMISSION_DENIED</code>, or
    // <code>FAILED_PRECONDITION</code> with <code>reason=call-supervision-requires-auth</code> when auth is not enforced.
    // Every action writes an audit record (who, call, when, mode, target). No announcement is played to the caller.</p>
    rpc TransferCall (TransferCallRequest) returns (TransferCallResponse);

    // <p>Transfer several calls, each like <code>TransferCall</code>.</p>
    // <p>Authorization: requires the role <code>PROJECT_DEVELOPER</code> or higher on the project, and the server&apos;s
    // Keycloak auth mode <code>ENFORCE</code>; otherwise <code>PERMISSION_DENIED</code>, or
    // <code>FAILED_PRECONDITION</code> with <code>reason=call-supervision-requires-auth</code> when auth is not enforced.
    // Every action writes an audit record (who, call, when, mode, target). No announcement is played to the caller.</p>
    rpc TransferCalls (TransferCallsRequest) returns (TransferCallsResponse);

    // <p>Get call log for single call instance</p>
    rpc GetCall (GetCallRequest) returns (Call);

    // <p>Get call log for all call instances</p>
    rpc ListCalls (ListCallsRequest) returns (ListCallsResponse);

    //////////////////////////////////////////////////////////////////////////////
    // Status stream endpoints
    //////////////////////////////////////////////////////////////////////////////

    // <p>Streams the status of the callers of a project: a snapshot first
    // (<code>snapshot = true</code>), then every caller whose call or SIP status changed, plus
    // keep-alive messages. Ends when the client disconnects or at the server-side maximum stream
    // duration.</p>
    // <p>Errors: <code>NOT_FOUND</code> for an unknown project; <code>RESOURCE_EXHAUSTED</code> when
    // the server has no free stream slot.</p>
    rpc StreamCallerStatus (StreamCallerStatusRequest) returns (stream StreamCallResourceStatusResponse);

    // <p>Streams the status of the listeners of a project, like <code>StreamCallerStatus</code>.</p>
    rpc StreamListenerStatus (StreamListenerStatusRequest) returns (stream StreamCallResourceStatusResponse);

    // <p>Streams the status of the scheduled callers of a project, like
    // <code>StreamCallerStatus</code>. The snapshot holds every PENDING and FIRING scheduled caller
    // and those that finished in the last hour.</p>
    rpc StreamScheduledCallerStatus (StreamScheduledCallerStatusRequest) returns (stream StreamCallResourceStatusResponse);

    //////////////////////////////////////////////////////////////////////////////
    // Call control endpoints
    //////////////////////////////////////////////////////////////////////////////

    // <p>Invite a registered softphone account of the project into a connected call. Returns the participant in
    // <code>PARTICIPANT_STATE_RINGING</code>; follow <code>Call.participants</code> or the events
    // <code>VTSI_EVENT_CALL_PARTICIPANT_*</code> for JOINED, FAILED and LEFT.</p>
    // <p><code>PARTICIPANT_MODE_CONFERENCE</code> (default) joins the softphone into the call: Asterisk mixes the caller,
    // the bot and the participant, and by default the bot keeps talking and listening
    // (<code>BOT_POLICY_ON_JOIN_KEEP</code>). <code>PARTICIPANT_MODE_MONITOR</code> lets the participant listen only.
    // When the bot&apos;s leg ends, every participant is hung up; the caller is handed over only by a WARM
    // <code>TransferCall</code>. Idempotent per <code>request_id</code>.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code>, <code>NOT_FOUND</code> (call or softphone account, including another
    // project&apos;s), <code>FAILED_PRECONDITION</code> (<code>call-not-connected</code>, <code>amd-in-progress</code>,
    // <code>softphone-not-registered</code>, <code>softphone-disabled</code>, <code>softphone-unrouted</code>,
    // <code>call-not-yet-identified</code>, <code>bot-channel-ambiguous</code>, <code>asterisk-not-local</code>,
    // <code>asterisk-version-unsupported</code>), <code>ALREADY_EXISTS</code> (the softphone is already ringing or joined),
    // <code>ABORTED</code> (<code>transfer-in-progress</code>), <code>RESOURCE_EXHAUSTED</code> (participant cap),
    // <code>UNAVAILABLE</code> (<code>asterisk-unreachable</code>).</p>
    // <p>Authorization: requires the role <code>PROJECT_DEVELOPER</code> or higher on the project, and the server&apos;s
    // Keycloak auth mode <code>ENFORCE</code>; otherwise <code>PERMISSION_DENIED</code>, or
    // <code>FAILED_PRECONDITION</code> with <code>reason=call-supervision-requires-auth</code> when auth is not enforced.
    // Every action writes an audit record (who, call, when, mode, target). No announcement is played to the caller.</p>
    rpc InviteToCall (InviteToCallRequest) returns (InviteToCallResponse);

    // <p>Hang up a participant of a call (ringing or joined). The participant ends as
    // <code>PARTICIPANT_STATE_LEFT</code> with <code>end_reason = REMOVED</code>; the call and the bot are not
    // affected.</p>
    // <p>Authorization: <code>PROJECT_EXECUTOR</code> or higher. Audited like <code>InviteToCall</code>.</p>
    rpc RemoveCallParticipant (RemoveCallParticipantRequest) returns (RemoveCallParticipantResponse);

    // <p>Mute the bot of a connected call and/or stop it listening to the caller, or undo either. Every request sets a
    // desired level and never toggles: a repeat answers <code>changed = false</code>. The bot stays muted while
    // anything else (a TALK take-over of <code>StreamCallAudio</code>, a participant bot policy) also holds it muted.</p>
    // <p>Errors as for <code>InviteToCall</code>, plus <code>FAILED_PRECONDITION</code> <code>reason=sip-image-too-old</code>,
    // <code>ABORTED</code> <code>reason=call-control-busy</code> (another call-control request for the call is running)
    // and <code>UNAVAILABLE</code> <code>reason=sip-unreachable</code> or <code>reason=csi-media-control-failed</code> (the
    // bot did not apply the level: a requested pause is rolled back, a requested mute is kept).</p>
    // <p>Authorization: requires the role <code>PROJECT_DEVELOPER</code> or higher on the project, and the server&apos;s
    // Keycloak auth mode <code>ENFORCE</code>; otherwise <code>PERMISSION_DENIED</code>, or
    // <code>FAILED_PRECONDITION</code> with <code>reason=call-supervision-requires-auth</code> when auth is not enforced.
    // Every action writes an audit record (who, call, when, mode, target). No announcement is played to the caller.</p>
    rpc SetCallMediaControl (SetCallMediaControlRequest) returns (SetCallMediaControlResponse);

    // <p>Live audio of a connected call, both ways. The first request MUST be <code>config</code> (within 2 seconds).
    // LISTEN receives the caller mixed with the bot. TALK sends the agent&apos;s audio to the caller and REQUIRES
    // <code>take_over</code>: the bot is muted and does not listen while the stream is connected, and resumes when it
    // ends; in TALK the agent hears the caller only. Audio is LINEAR16 little-endian mono in 20 ms frames.</p>
    // <p>Bidirectional streaming: available to native gRPC clients (python, nodejs) only. Browser (grpc-web) clients
    // use <code>ListenCallAudio</code>, plus a softphone (<code>InviteToCall</code>) to talk.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> (no or invalid <code>config</code>, TALK without
    // <code>take_over</code>, wrong frame size), <code>NOT_FOUND</code>, <code>FAILED_PRECONDITION</code>
    // (<code>call-not-connected</code>, <code>amd-in-progress</code>, <code>call-not-yet-identified</code>,
    // <code>bot-still-speaking</code>, <code>sip-image-too-old</code>), <code>RESOURCE_EXHAUSTED</code> (stream cap, a
    // second TALK). A normal end sends one <code>ended</code> message, then OK. A second <code>config</code> or audio
    // sent in LISTEN mode ends the stream with <code>INVALID_ARGUMENT</code>. A client half-close ends the stream
    // (<code>CALL_AUDIO_END_REASON_CLIENT_CLOSED</code>), so a listening client keeps its request stream open.</p>
    // <p>Authorization: requires the role <code>PROJECT_DEVELOPER</code> or higher on the project, and the server&apos;s
    // Keycloak auth mode <code>ENFORCE</code>; otherwise <code>PERMISSION_DENIED</code>, or
    // <code>FAILED_PRECONDITION</code> with <code>reason=call-supervision-requires-auth</code> when auth is not enforced.
    // Every action writes an audit record (who, call, when, mode, target). No announcement is played to the caller.</p>
    rpc StreamCallAudio (stream StreamCallAudioRequest) returns (stream StreamCallAudioResponse);

    // <p>Listen-only live audio of a connected call, like <code>StreamCallAudio</code> in LISTEN mode, as a server
    // stream that grpc-web (browser) clients can consume. <code>config.mode</code> must be LISTEN or unspecified and
    // <code>config.take_over</code> must be false, otherwise <code>INVALID_ARGUMENT</code> <code>reason=listen-only</code>.</p>
    // <p>Authorization: requires the role <code>PROJECT_DEVELOPER</code> or higher on the project, and the server&apos;s
    // Keycloak auth mode <code>ENFORCE</code>; otherwise <code>PERMISSION_DENIED</code>, or
    // <code>FAILED_PRECONDITION</code> with <code>reason=call-supervision-requires-auth</code> when auth is not enforced.
    // Every action writes an audit record (who, call, when, mode, target). No announcement is played to the caller.</p>
    rpc ListenCallAudio (ListenCallAudioRequest) returns (stream StreamCallAudioResponse);

}

// Base configuration of services (ondewo-nlu, text-to-speech, speech-to-text, asterisk)
message BaseServiceConfig{

    // service host IP
    string host = 1;

    // service port
    int32 port = 2;

    // PEM certificate(s) the service&apos;s gRPC server certificate chains to (CA or self-signed leaf), with real or
    // escaped newlines; never a private key. Required for the S2T, NLU and T2S configs of a call unless the VTSI
    // server runs with ONDEWO_VTSI_ALLOW_INSECURE_UPSTREAM=True (lab and CI only); an empty value is otherwise
    // refused with FAILED_PRECONDITION (UPSTREAM_TLS_REQUIRED).
    string grpc_cert = 3;
}

// Credentials
message Credentials {

    // Account name - usually email address
    string account_name = 1;

    // password of the account
    string password = 2;
}

// NLU Configuration
message NluVtsiConfig{

    // Base config
    // Host, Port, and [Optional] GRPC cert
    BaseServiceConfig nlu_base_config = 1;

    // authentication information (login information)
    oneof authentication {

        // Credentials with classical username and password
        Credentials credentials = 2;

        // Authentication token
        string auth_token = 3;
    }

    // The resource name of the agent.
    // Format: <pre><code>projects/&lt;uuid&gt;/agent</code></pre>
    string agent_name = 4;

    // language code in a two letter iso code, e.g. de, en, etc.
    string language_code = 5;

    // name of intent to trigger at the start of a call
    string initial_intent = 6;

    // ondewo-nlu list of contexts
    repeated ondewo.nlu.Context contexts = 7;

    // http basic auth token
    string http_basic_auth_token = 8;

    // Return the message specified in Intent.Message.Platform platform to the user in the DetectIntentResponse
    optional ondewo.nlu.Intent.Message.Platform platform = 9;

}

// Text-2-Speech Configuration
message T2sVtsiConfig{

    // Host, Port, and [Optional] GRPC cert
    BaseServiceConfig t2s_base_config = 1;

    // Configuration of Text-2-Speech
    ondewo.t2s.RequestConfig t2s_request_config = 2;
}

// Speech-2-Text Configuration
message S2tVtsiConfig{

    // Host, Port, and [Optional] GRPC cert
    BaseServiceConfig s2t_base_config = 1;

    // Configuration of Speech-2-Text
    ondewo.s2t.TranscribeRequestConfig s2t_transcribe_request_config = 2;
}

// Asterisk configuration
message AsteriskConfig{

    // Host, Port, and [Optional] GRPC cert
    BaseServiceConfig asterisk_base_config = 1;
}

// Service Configs of Speech-2-Text, NLU, Text-2-Speech and CSI which are common for both listener and caller
message CommonServicesConfig{

    // speech-to-text service configuration
    S2tVtsiConfig s2t_vtsi_config = 1;

    // ondewo-nlu configuration
    NluVtsiConfig nlu_vtsi_config = 2;

    // text-to-speech service configuration
    T2sVtsiConfig t2s_vtsi_config = 3;

    // CSI service configuration
    CsiVtsiConfig csi_vtsi_config = 4;

    // Voice interaction configuration for turn detection, interruption (barge-in) handling and response timing
    VoiceInteractionConfig voice_interaction_config = 5;

}

// Configuration of the voice interaction behavior of a call:
// turn detection, interruption (barge-in) handling and response timing
message VoiceInteractionConfig{

    // Configuration of the turn detection
    TurnDetectionConfig turn_detection_config = 1;

    // Configuration of the interruption (barge-in) handling
    InterruptionHandlingConfig interruption_handling_config = 2;

    // Configuration of the response timing
    ResponseTimingConfig response_timing_config = 3;

    // Configuration of the answering machine detection (AMD) of an outbound call.
    // Only accepted for pooled persistent callers: a listener or a one-shot caller that carries it
    // is rejected with INVALID_ARGUMENT
    AnsweringMachineDetectionConfig answering_machine_detection_config = 4;
}

// Configuration of the turn detection, i.e. deciding when the caller has finished speaking
message TurnDetectionConfig{

    // Mode of the turn detection
    enum TurnDetectionMode {

        // Unspecified turn detection mode defaults to SEMANTIC_MODEL
        TURN_DETECTION_MODE_UNSPECIFIED = 0;

        // Turn detection based on voice activity detection, i.e. pauses in the caller audio (fallback mode)
        VAD = 1;

        // Turn detection based on a semantic (LLM) turn detection model of the speech-to-text service (default)
        SEMANTIC_MODEL = 2;

        // Turn detection based on an audio-native turn detection model
        AUDIO_MODEL = 3;
    }

    // Mode of the turn detection. Defaults to SEMANTIC_MODEL if unspecified
    TurnDetectionMode mode = 1;

    // Optional: Minimum delay in seconds before a confidently detected end of turn is committed (default: 0.5)
    optional float min_endpointing_delay_seconds = 2;

    // Optional: Maximum delay in seconds to wait for an end of turn before the turn is committed
    // from the latest stable partial transcription (default: 3.0)
    optional float max_endpointing_delay_seconds = 3;

    // Eagerness of the turn detection
    enum TurnEagerness {

        // Unspecified turn eagerness defaults to NORMAL
        TURN_EAGERNESS_UNSPECIFIED = 0;

        // Patient turn taking: scales the endpointing delays by a factor of 1.7
        PATIENT = 1;

        // Normal turn taking: keeps the endpointing delays unchanged (factor 1.0)
        NORMAL = 2;

        // Eager turn taking: scales the endpointing delays by a factor of 0.6
        EAGER = 3;
    }

    // Eagerness of the turn detection: scales both endpointing delays. Defaults to NORMAL if unspecified
    TurnEagerness turn_eagerness = 4;

    // System prompt for the semantic (LLM) turn detection model of the speech-to-text service
    optional string turn_detection_system_prompt = 5;

    // User prompt for the semantic (LLM) turn detection model of the speech-to-text service
    optional string turn_detection_user_prompt = 6;
}

// Configuration of the interruption (barge-in) handling, i.e. the caller speaking while the bot is speaking
message InterruptionHandlingConfig{

    // Optional: Enable interruption (barge-in) handling, i.e. the caller can interrupt the bot while it is speaking
    optional bool enabled = 1;

    // Optional: Minimum duration in seconds of caller speech while the bot is speaking
    // to trigger an interruption (noise gate) (default: 0.5)
    optional float min_interruption_duration_seconds = 2;

    // Optional: Minimum number of transcribed words of caller speech while the bot is speaking
    // to trigger an interruption (default: 2)
    optional int32 min_interruption_words = 3;

    // Optional: Time in seconds after an interruption trigger without a committed transcription
    // after which the interruption is classified as a false interruption (default: 2.0)
    optional float false_interruption_timeout_seconds = 4;

    // Optional: Resume the paused bot response after a false interruption,
    // e.g. a cough or brief background noise (default: true)
    optional bool resume_after_false_interruption = 5;

    // Optional: Silence in seconds after a real interruption before the next bot response is played (default: 1.0)
    optional float backoff_seconds = 6;

    // Optional: Protect the first bot message from interruptions
    // for the given number of seconds (default: 0 = no protection)
    optional float first_message_protected_seconds = 7;

    // Transcribe caller speech while the bot is speaking even if interruptions are disabled
    optional bool transcribe_on_disabled_interruptions = 8;
}

// Configuration of the response timing, i.e. when and how the bot responds
message ResponseTimingConfig{

    // Optional: Seconds of caller silence after a bot response until a follow-up event
    // is triggered (default: 20.0, valid range: 1.0 - 30.0)
    optional float turn_timeout_seconds = 1;

    // Optional: Seconds of caller silence until the call is ended.
    // Unset = off (-1 is also accepted as explicit off)
    optional float silence_end_call_timeout_seconds = 2;

    // Configuration of the soft timeout filler messages
    SoftTimeoutConfig soft_timeout_config = 3;

    // Optional: Enable preemptive response generation on an eagerly detected end of turn (default: false)
    optional bool preemptive_generation_enabled = 4;

    // Optional: Enable chunked text-to-speech streaming for a lower time to first audio (default: false)
    optional bool t2s_chunked_streaming_enabled = 5;
}

// Configuration of the soft timeout, i.e. filler messages played
// when the response generation takes longer than the timeout
message SoftTimeoutConfig{

    // Optional: Seconds after which a filler message is played while the response is still being generated.
    // Unset = off (-1 is also accepted as explicit off). Recommended: 3.0
    optional float timeout_seconds = 1;

    // Filler messages, rotated per soft timeout (maximum 7 messages, each 1 - 200 characters)
    repeated string messages = 2;

    // Optional: Maximum number of filler messages per response generation (default: 1)
    optional int32 max_per_generation = 3;
}

// Configuration of the answering machine detection (AMD) of an outbound call, i.e. deciding in the first
// seconds after the callee answered whether a person, an answering machine, a fax, an IVR or a network
// announcement picked up, and hanging up on the non-human ones.
// Detection listens first: the bot stays silent until the verdict is reached or the decision window ends.
// Every field is optional: an unset field takes the default of the CSI container (listed per field below).
// Only accepted for pooled persistent callers; the settings are part of the caller container configuration,
// so callers with different AMD settings are never pooled together.
// The verdict of a call is reported as ondewo.sip.SipStatus.amd_result. Reaching a hang-up-eligible verdict sets
// the non-terminal status ondewo.sip.SipStatus.StatusType.OUTGOING_CALL_ANSWERING_MACHINE_DETECTED (the call is
// still up), and a call ended by AMD reaches the terminal status OUTGOING_CALL_FINISHED with one of these
// descriptions:
// <ul>
// <li>"Answering machine detected with hang up": the caller hung up without leaving a voice message</li>
// <li>"Answering machine detected with left voice message and hang up": the caller hung up after starting the
// voice message</li>
// <li>"Answering machine detected, call ended by the answering machine": the far end hung up before a voice
// message was started</li>
// <li>"Answering machine detected, call ended by the answering machine after leaving a voice message": the far
// end hung up after the voice message was started</li>
// </ul>
// The description is also recorded on the call as Call.answering_machine_detection_end_description.
// Compliance: leaving a recorded message on a consumer's mailbox for marketing purposes requires the consent of
// the callee in many jurisdictions (e.g. in Germany § 7 UWG). HANG_UP is therefore the default action.
message AnsweringMachineDetectionConfig{

    // What to do once a non-human verdict is reached
    enum AmdAction {

        // Unspecified action defaults to HANG_UP
        AMD_ACTION_UNSPECIFIED = 0;

        // Hang up at once on a non-human verdict whose per-verdict hang-up switch is on
        // (an answering machine is always hung up on) (default)
        HANG_UP = 1;

        // Only detect and record the verdict, never hang up: OUTGOING_CALL_ANSWERING_MACHINE_DETECTED is still
        // set, then the far end is treated as a person and the call continues with the greeting and ends
        // normally (shadow mode to calibrate the detection before enabling HANG_UP)
        DETECT_ONLY = 2;

        // Leave a voice message on a hang-up-eligible verdict, then hang up: the fulfillment of
        // voice_message_intent is spoken once after the beep (or after the end of the machine greeting),
        // and the call is hung up when it finished playing or when voice_message_timeout_ms elapsed,
        // whichever comes first. A FAX verdict never gets a voice message; it is hung up on when
        // hang_up_on_fax is on. See the compliance note above before enabling it
        LEAVE_VOICE_MESSAGE = 3;
    }

    // Sensitivity of the detection: selects the enabled detection rules and their internal thresholds
    enum AmdSensitivity {

        // Unspecified sensitivity defaults to LOW
        AMD_SENSITIVITY_UNSPECIFIED = 0;

        // Most conservative towards people: only strong machine evidence leads to a machine verdict (default)
        LOW = 1;

        // Balanced between missed machines and people classified as machines
        MEDIUM = 2;

        // Most aggressive: detects more machines at a higher risk of hanging up on a person
        HIGH = 3;
    }

    // Optional: Master switch of the answering machine detection (default: false)
    optional bool active = 1;

    // Optional: Action on a non-human verdict (default: HANG_UP)
    optional AmdAction action = 2;

    // Optional: Sensitivity of the detection (default: LOW)
    optional AmdSensitivity sensitivity = 3;

    // Optional: Maximum time in milliseconds after the callee answered to reach a verdict when no
    // machine-leaning evidence was seen; the verdict is UNKNOWN when it is reached
    // (default: 4000, valid range: 1500 - 10000)
    optional int32 max_decision_time_ms = 4;

    // Optional: Maximum time in milliseconds after the callee answered to reach a verdict once
    // machine-leaning evidence extended the decision window (default: 11000, valid range: 4000 - 20000)
    optional int32 max_machine_wait_ms = 5;

    // Optional: Time in milliseconds to wait for a beep after a long greeting ended
    // (default: 1500, valid range: 0 - 4000)
    optional int32 beep_wait_after_greeting_ms = 6;

    // Optional: Silence in milliseconds after the callee answered without any speech, after which the verdict
    // is NO_SPEECH, which is treated like a person (default: 3500, valid range: 1000 - 10000)
    optional int32 initial_silence_ms = 7;

    // Optional: Continuous speech in milliseconds beyond which a greeting is machine-leaning
    // (default: 2400, valid range: 1000 - 6000)
    optional int32 max_human_greeting_ms = 8;

    // Optional: Silence in milliseconds after the first speech burst that ends a human greeting
    // (default: 900, valid range: 300 - 3000)
    optional int32 greeting_end_silence_ms = 9;

    // Optional: Enable the tone detector for the beep of an answering machine (default: true)
    optional bool beep_detection_active = 10;

    // Additional phrases that indicate an answering machine, added to the built-in de and en phrase lists
    // (maximum 50 phrases, each 1 - 80 characters)
    repeated string additional_machine_phrases = 11;

    // Additional phrases that indicate a person, added to the built-in de and en phrase lists
    // (maximum 50 phrases, each 1 - 80 characters)
    repeated string additional_human_phrases = 12;

    // Optional: Hang up on a FAX verdict when the action is HANG_UP (default: true)
    optional bool hang_up_on_fax = 13;

    // Optional: Hang up on a NETWORK_ANNOUNCEMENT verdict, e.g. "the number is not reachable",
    // when the action is HANG_UP (default: true)
    optional bool hang_up_on_network_announcement = 14;

    // Optional: Hang up on an IVR verdict, i.e. an automated menu, when the action is HANG_UP (default: false)
    optional bool hang_up_on_ivr = 15;

    // Optional: Hang up on a CALL_SCREENING verdict, i.e. a call screening assistant asking for the reason of
    // the call, when the action is HANG_UP (default: false)
    optional bool hang_up_on_call_screening = 16;

    // Optional: Name of the NLU intent whose fulfillment is the voice message when the action is
    // LEAVE_VOICE_MESSAGE; it is triggered once (default: the welcome intent of the NLU project,
    // 1 - 200 characters when set)
    optional string voice_message_intent = 17;

    // Optional: Maximum time in milliseconds after the verdict to wait for the beep, or for the end of the
    // machine greeting, before the voice message is spoken when the action is LEAVE_VOICE_MESSAGE;
    // 0 speaks immediately (default: 10000, valid range: 0 - 30000)
    optional int32 voice_message_max_beep_wait_ms = 18;

    // Optional: Maximum time in milliseconds after the verdict until the call is hung up when the action is
    // LEAVE_VOICE_MESSAGE, also when the voice message has not finished playing
    // (default: 30000, valid range: 5000 - 120000)
    optional int32 voice_message_timeout_ms = 19;

    // Optional: Enable the detection of machine and person phrases in the transcribed greeting, i.e. the
    // built-in phrase lists plus additional_machine_phrases and additional_human_phrases; turning it off
    // removes this evidence and the detection rules that need it (default: true)
    optional bool keyword_detection_active = 20;

    // Optional: Enable the detection based on the speech and silence cadence of the greeting, e.g. its
    // length and the silence after it; turning it off removes this evidence and the detection rules that
    // need it (default: true)
    optional bool cadence_detection_active = 21;
}

// The base config is for both the listener and caller. If you only provide it you will get a listener
// You will need to provide <code>SipCallerConfig</code> for the caller
message SipBaseConfig{

    // version of sip to use for call, semantic versioning e.g., 1.0.0, 1.1.0-pre-release, etc.
    string sip_sim_version = 1;

}

// Configuration of the SIP caller
message SipCallerConfig{

    // SIP configuration
    SipBaseConfig sip_base_config = 1;

    // callee id e.g. phone number to call, +4365012345678 or VOIP phone ondewo0001@ondewo.com, etc.
    string callee_id = 2;

    // dictionary of sip headers that are sent on call
    map<string, string> sip_headers = 3;

}


// CSI configuration
message CsiVtsiConfig{

    // Callback for the Speech-2-Text platform
    S2tVtsiCallbacks s2t_vtsi_callbacks = 1;

    // Callback for the NLU platform
    NluVtsiCallbacks nlu_vtsi_callbacks = 2;

    // Callback for the Text-2-Speech platform
    T2sVtsiCallbacks t2s_vtsi_callbacks = 3;

    // Configuration of the Minio Audio Object Store
    AudioObjectStorageConfig audio_object_store_config = 4;

    // Configuration of the RabbitMQ Message Broker
    MessageBrokerConfig message_broker_config = 5;

    // Setting to activate if it is possible to send control messages
    // <ul>
    //   <li>via RabbitMQ to remote control the system</li>
    //   <li>via embeddings in NLU text responses</li>
    // </ul>
    // Explicitly optional: leaving the field unset means the caller expresses no preference and the
    // server keeps its own configured default. That is NOT the same as sending
    // <pre><code>false</code></pre>, which is a request to switch control messages off. A
    // presence-less bool cannot tell the two apart, so an unset field arrived as
    // <pre><code>false</code></pre> and silently disabled control messages for callers that never
    // mentioned them.
    optional bool activate_control_messages = 6;

}

// Minio Audio Object Store
message AudioObjectStorageConfig{

    // Audio storage should be activated or not
    optional bool activate_audio_object_storage = 1;

    // Configuration of the Minio Audio Object Store
    AudioObjectStorageServicesActivationConfig audio_object_storage_services_activation_config = 2;

}

// Configuration of the Minio Audio Object Store
message AudioObjectStorageServicesActivationConfig{

    // Should audio object store save audio sent to the Speech-2-Text platform
    optional bool activate_s2t = 1;

    // Should audio object store save audio generated from the Text-2-Speech platform
    optional bool activate_t2s = 2;
}

// Configuration of the RabbitMQ Message Broker
message MessageBrokerConfig{

    // Should the broker be activated or not
    optional bool activate_message_broker = 1;

    // Configuration of the Broker service activation
    MessageBrokerServicesActivationConfig message_broker_services_activation_config = 2;

    oneof message_broker_config{
        // Configuration of the RabbitMQ Message Broker
        RabbitMqConfig rabbit_mq_config = 3;
    }
}

// Configuration of the RabbitMQ Message Broker
message MessageBrokerServicesActivationConfig{

    // should RabbitMQ Message Broker be activated for Speech-2-Text platform
    optional bool activate_s2t = 1;

    // should RabbitMQ Message Broker be activated for NLU platform
    optional bool activate_nlu = 2;

    // should RabbitMQ Message Broker be activated for Text-2-Speech platform
    optional bool activate_t2s = 3;

    // should RabbitMQ Message Broker be activated for SIP platform
    optional bool activate_sip = 4;
}

// Configuration of the RabbitMQ Message Broker
message RabbitMqConfig{

    // host where the rabbit mq server runs
    string host = 1;

    // port where the rabbit mq server runs
    int32 port = 2;

    // secondary port where the rabbit mq server runs
    int32 port_2 = 3;

    // user of server
    string user = 4;

    // password of server
    string password = 5;

}


// Callback for the Speech-2-Text platform
message S2tVtsiCallbacks{

    // Callback executed before the Speech-2-Text will be called
    repeated string pre_s2t_callbacks = 1;

    // Callback executed after the Speech-2-Text has been called
    repeated string post_s2t_callbacks = 2;

}

// Callback for the NLU platform
message NluVtsiCallbacks{

    // Callback executed before the NLU will be called
    repeated string pre_nlu_callbacks = 1;

    // Callback executed after the NLU has been called
    repeated string post_nlu_callbacks = 2;

}
// Callback for the Text-2-Speech platform
message T2sVtsiCallbacks{

    // Callback executed before the Text-2-Speech will be called
    repeated string pre_t2s_callbacks = 1;

    // Callback executed after the Text-2-Speech has been called
    repeated string post_t2s_callbacks = 2;

}

// Listener represents a listener instance that waits for incoming calls
message Listener {

    // VTSI project name with which to perform the call of the form
    // <pre><code>projects/&lt;project_uuid&gt;/listeners/&lt;listener_uuid&gt;</code></pre>
    string name = 1;

    // The call name that was assigned to the call
    // <pre><code>projects/&lt;project_uuid&gt;/listeners/&lt;listener_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    string call_name = 2;

    // SIP service configuration
    SipBaseConfig sip_base_config = 3;

    // Service Configs of Speech-2-Text, NLU, Text-2-Speech and CSI
    CommonServicesConfig common_services_config = 4;

}

// Caller represents a caller instance that initiates outbound calls
message Caller {

    // Caller name with which to perform the call of the form
    // <pre><code>projects/&lt;project_uuid&gt;/callers/&lt;caller_uuid&gt;</code></pre>
    string name = 1;

    // The call name that was assigned to the call
    // <pre><code>projects/&lt;project_uuid&gt;/callers/&lt;caller_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    string call_name = 2;

    // SIP service configuration
    SipCallerConfig sip_caller_config = 3;

    // Service Configs of Speech-2-Text, NLU, Text-2-Speech and CSI
    CommonServicesConfig common_services_config = 4;
}


// Request for starting a listener
message StartListenerRequest {

    // VTSI project name which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // SIP service configuration
    SipBaseConfig sip_base_config = 2;

    // Service Configs of Speech-2-Text, NLU, Text-2-Speech and CSI
    CommonServicesConfig common_services_config = 3;

}

// Response to start multiple listeners
message StartListenerResponse {

    // VTSI project name which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // The listener that was started
    Listener listener = 2;

    // error message if you have any so if it's unhealthy
    string error_message = 3;

}

// Request to start multiple listeners
message StartListenersRequest {

    // VTSI project name which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Listeners that should be started
    repeated StartListenerRequest listener_requests = 2;

    // Optional client idempotency key: at most 255 printable ASCII characters, no whitespace; empty means no
    // deduplication. A retry carrying the same key returns the response of the first successful attempt instead
    // of running the request a second time, whichever server replica it reaches, for as long as the server
    // retains the key (24 hours by default). The key is scoped to the VTSI project and to this RPC. Reusing a
    // key with a different request is refused with <code>INVALID_ARGUMENT</code>. A retry that arrives while the
    // first attempt is still running is answered <code>ABORTED</code> and may be retried later. A first attempt
    // that fails stores nothing, so a retry after a failure runs the request again. A replayed response carries
    // no <code>common_services_config</code>: the server keeps no second copy of the credentials it holds. To
    // make a single caller or listener idempotent, send it as a batch of one.
    string idempotency_key = 3;
}

// Response to start multiple listeners
message StartListenersResponse {

    // VTSI project name which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // The call ids that were assigned to each listener
    repeated StartListenerResponse listener_responses = 2;

    // overall error message if you have any so if it's unhealthy
    string error_message = 3;

}

// Request for starting a caller
message StartCallerRequest {

    // VTSI project name which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // SIP service configuration
    SipCallerConfig sip_caller_config = 2;

    // Service Configs of Speech-2-Text, NLU, Text-2-Speech and CSI
    CommonServicesConfig common_services_config = 3;

}

// Response to start multiple listeners
message StartCallerResponse {

    // VTSI project name which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // The caller that was started
    Caller caller = 2;

    // error message if you have any so if it's unhealthy
    string error_message = 3;

}

// Request to start multiple callers
message StartCallersRequest {

    // VTSI project name which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Callers that should be started
    repeated StartCallerRequest caller_requests = 2;

    // Field 3 was campaign_assignment in unreleased 9.0.0 development builds; use AddCallersToCampaign. A
    // request that still carries it is refused with INVALID_ARGUMENT.
    reserved 3;
    reserved "campaign_assignment";

    // Optional client idempotency key: at most 255 printable ASCII characters, no whitespace; empty means no
    // deduplication. A retry carrying the same key returns the response of the first successful attempt instead
    // of running the request a second time, whichever server replica it reaches, for as long as the server
    // retains the key (24 hours by default). The key is scoped to the VTSI project and to this RPC. Reusing a
    // key with a different request is refused with <code>INVALID_ARGUMENT</code>. A retry that arrives while the
    // first attempt is still running is answered <code>ABORTED</code> and may be retried later. A first attempt
    // that fails stores nothing, so a retry after a failure runs the request again. A replayed response carries
    // no <code>common_services_config</code>: the server keeps no second copy of the credentials it holds. To
    // make a single caller or listener idempotent, send it as a batch of one.
    string idempotency_key = 4;

}

// Response to the start caller request
message StartCallersResponse {

    // VTSI project name which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // The call ids that were assigned to each listener
    repeated StartCallerResponse caller_responses = 2;

    // overall error message if you have any so if it's unhealthy
    string error_message = 3;

    // Fields 4 and 5 carried the campaign result in unreleased 9.0.0 development builds; see
    // AddCallersToCampaignResponse.
    reserved 4, 5;
    reserved "campaign", "campaign_call_names";

}


// Represents a request to list callers.
message ListCallersRequest {

    // VTSI project name for which to perform the call.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Optional. The next_page_token value returned from a previous list request.
    // Example: "current_index-1--page_size-20"
    optional string page_token = 2;

    // you can specify the view to be shallow or full
    optional CallView call_view = 3;

}

// Represents the response for listing callers.
message ListCallersResponse {

    // The list of callers.
    repeated Caller callers = 1;

    // Token to retrieve the next page of results.
    // This field is a string that holds a token for fetching the next page of results.
    // If there are no more results in the list, this field will be empty.
    string next_page_token = 2;

}

