    // <code>StopCallsResponse.stop_call_responses</code>, relative to the entry message
    // <code>StopCallResponse</code>, i.e. <code>vtsi_project_name</code> and <code>error_message</code> (the
    // entries carry no <code>Call</code>). <code>call_name</code> of each entry and
    // <code>StopCallsResponse.error_message</code> are always populated. Unset or empty returns every field. An
    // unknown path is rejected with <code>INVALID_ARGUMENT</code> naming it, before anything is stopped. It
    // shapes only the response: the calls are stopped regardless.
    google.protobuf.FieldMask field_mask = 3;
}

// Response to stop/kill a ondewo-sip listener or caller instance for a specific vtsi-project.
message StopCallsResponse {

    // responses to stop/kill a ondewo-sip listener or caller instance for a specific vtsi-project.
    repeated StopCallResponse stop_call_responses = 1;

    // overall error message if you have any so if it's unhealthy
    string error_message = 2;
}

// Request to stop all calls of a VTSI project, so all listeners and callers
message StopAllCallsRequest {

    // VTSI project name with which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Optional. Partial response: the field paths to populate in EVERY entry of
    // <code>StopCallsResponse.stop_call_responses</code>, relative to the entry message
    // <code>StopCallResponse</code>, i.e. <code>vtsi_project_name</code> and <code>error_message</code> (the
    // entries carry no <code>Call</code>). <code>call_name</code> of each entry and
    // <code>StopCallsResponse.error_message</code> are always populated. Unset or empty returns every field. An
    // unknown path is rejected with <code>INVALID_ARGUMENT</code> naming it, before anything is stopped. It
    // shapes only the response: the calls are stopped regardless.
    google.protobuf.FieldMask field_mask = 2;
}

// Request to transfer calls
message TransferCallRequest{

    // VTSI project name with which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // call name to transfer
    // For listener this is <pre><code>projects/&lt;project_uuid&gt;/listeners/&lt;listener_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    // For callers this is <pre><code>projects/&lt;project_uuid&gt;/callers/&lt;caller_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    string call_name = 2;

    // LEGACY raw target: the dialplan extension, voip number or phone number to transfer the call to. Validated against
    // <code>^\+?[A-Za-z0-9._-]{1,64}$</code>. Mutually exclusive with <code>target</code>: setting both is
    // <code>INVALID_ARGUMENT</code>
    string transfer_id = 3;

    // Typed target of the transfer, resolved and validated by the server. Mutually exclusive with <code>transfer_id</code>
    CallTarget target = 4;

    // How to transfer. Unspecified means <code>TRANSFER_MODE_BLIND</code>
    TransferMode mode = 5;

    // Optional headers handed to the transfer target. Keys must match <code>X-ondewo-[A-Za-z0-9-]{1,64}</code>, at most 16
    // entries, values at most 256 bytes. Merged over the call&apos;s own headers. They are delivered through the
    // dialplan, not on the SIP REFER (Asterisk does not forward REFER headers to the target). Not delivered to a phone
    // number target
    map<string, string> headers = 6;

    // WARM only: how long the target may ring, in seconds, <code>5</code> to <code>120</code>. <code>0</code> means
    // <code>30</code>
    int32 ring_timeout_s = 7;

}

// <p>Target of a transfer</p>
message CallTarget {

    // One of the following
    oneof target {

        // Phone number in E.164 form, e.g. <code>+4312345678</code> (<code>^\+[1-9][0-9]{6,14}$</code>). Any E.164 number
        // is allowed unless the project configures <code>VtsiProject.transfer_phone_number_allowlist</code>
        string phone_number = 1;

        // A softphone account of the same project:
        // <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;account_uuid&gt;</code></pre>. It must be enabled,
        // routed and registered
        string softphone_account_name = 2;

        // A listener of the same project: <pre><code>projects/&lt;project_uuid&gt;/listeners/&lt;listener_uuid&gt;</code></pre>.
        // The call goes to that listener&apos;s idle container; a busy listener is refused (<code>listener-busy</code>)
        string listener_name = 3;

        // The project&apos;s listener queue: any idle listener of the project takes the call
        ListenerQueueTarget listener_queue = 4;
    }
}

// <p>The project&apos;s listener queue as a transfer target. Carries no fields</p>
message ListenerQueueTarget {}

// <p>How a call is transferred</p>
enum TransferMode {

    // Same as <code>TRANSFER_MODE_BLIND</code>
    TRANSFER_MODE_UNSPECIFIED = 0;

    // SIP REFER: the caller is handed to the dialplan, which dials the target. A refused REFER keeps the call with the
    // bot; once the REFER is accepted the bot leaves, and a target that is then busy or does not answer loses the
    // caller
    TRANSFER_MODE_BLIND = 1;

    // The target is rung into the call first; the bot leaves only after the target joined, and keeps the call when the
    // target is busy or does not answer. Requires an Asterisk 22 project
    TRANSFER_MODE_WARM = 2;
}

// <p>Outcome of a transfer</p>
enum TransferOutcome {

    // No outcome recorded
    TRANSFER_OUTCOME_UNSPECIFIED = 0;

    // BLIND: the REFER was accepted and the bot left the call. WARM: the target answered and was bridged, and the bot
    // left the call
    TRANSFER_OUTCOME_ACCEPTED = 1;

    // WARM: the target is ringing. Follow <code>VTSI_EVENT_CALL_TRANSFERRED</code> /
    // <code>VTSI_EVENT_CALL_TRANSFER_FAILED</code> or <code>Call.last_transfer</code>
    TRANSFER_OUTCOME_PENDING = 2;

    // Refused before anything was sent; the call is untouched. <code>error_reason</code> says why
    TRANSFER_OUTCOME_TARGET_INVALID = 3;

    // The SIP server refused the REFER (including an unknown target extension); the call is KEPT with the bot.
    // <code>sip_response_code</code> carries the code where known
    TRANSFER_OUTCOME_REFER_REJECTED = 4;

    // No answer to the REFER in time, or (WARM) the target did not answer; the call is KEPT with the bot
    TRANSFER_OUTCOME_TIMEOUT = 5;

    // The far end left the call during the attempt
    TRANSFER_OUTCOME_CALL_ENDED = 6;

    // The call this request names is no longer the call the container is serving (e.g. the next call of a persistent
    // listener); nothing was sent
    TRANSFER_OUTCOME_CALL_SCOPE_MISMATCH = 7;

    // The call&apos;s SIP container could not be reached
    TRANSFER_OUTCOME_SIP_UNREACHABLE = 8;
}

// Response to transfer a call to a phone number or voip number
message TransferCallResponse {

    // VTSI project name with which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // call name to transfer
    // For listener this is <pre><code>projects/&lt;project_uuid&gt;/listeners/&lt;listener_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    // For callers this is <pre><code>projects/&lt;project_uuid&gt;/callers/&lt;caller_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    string call_name = 2;

    // transfer id to transfer the calls to, so the phone number or voip number you want to be transferred too
    string transfer_id = 3;

    // error message if you have any so if it's unhealthy
    string error_message = 4;

    // Outcome of the transfer
    TransferOutcome outcome = 5;

    // The dialplan extension the target resolved to, e.g. <code>ondewo0007</code>, a softphone user name,
    // <code>ondewoqueue</code> or the E.164 number
    string resolved_target = 6;

    // SIP response code of the REFER where known (<code>202</code> accepted, the refusal code otherwise), else
    // <code>0</code>
    int32 sip_response_code = 7;

    // Stable reason token of a refusal or failure, e.g. <code>target-not-registered</code>, <code>listener-busy</code>,
    // <code>queue-empty</code>, <code>self-transfer</code>, <code>number-not-allowed</code>; empty on success
    string error_reason = 8;

}

// <p>Record of the last transfer attempt of a call</p>
message CallTransferRecord {

    // Requested typed target; unset for a legacy <code>transfer_id</code> transfer
    CallTarget target = 1;

    // The dialplan extension the target resolved to
    string resolved_target = 2;

    // Mode of the transfer
    TransferMode mode = 3;

    // Outcome of the transfer
    TransferOutcome outcome = 4;

    // SIP response code of the REFER where known, else <code>0</code>
    int32 sip_response_code = 5;

    // When the outcome was recorded
    google.protobuf.Timestamp time = 6;
}

// <p>Desired setting of one media control flag of a call</p>
enum CallMediaSetting {

    // Leave the flag as it is
    CALL_MEDIA_SETTING_UNCHANGED = 0;

    // On: the bot speaks (<code>bot_voice</code>) or listens (<code>bot_listening</code>)
    CALL_MEDIA_SETTING_ON = 1;

    // Off: the bot is muted (<code>bot_voice</code>) or does not listen (<code>bot_listening</code>)
    CALL_MEDIA_SETTING_OFF = 2;
}

// <p>Effective media control state of a call</p>
message CallMediaControlState {

    // The bot is muted (by an operator, a TALK take-over or a participant bot policy)
    bool bot_muted = 1;

    // The bot does not listen to the caller
    bool listening_paused = 2;

    // Number of connected <code>StreamCallAudio</code> / <code>ListenCallAudio</code> streams
    int32 connected_audio_streams = 3;

    // Number of joined participants
    int32 joined_participants = 4;
}

// <p>How an invited participant takes part in a call</p>
enum ParticipantMode {

    // Same as <code>PARTICIPANT_MODE_CONFERENCE</code>
    PARTICIPANT_MODE_UNSPECIFIED = 0;

    // The participant is joined into the call: Asterisk mixes the caller, the bot and the participant
    PARTICIPANT_MODE_CONFERENCE = 1;

    // The participant listens only; the caller and the bot do not hear it
    PARTICIPANT_MODE_MONITOR = 2;
}

// <p>What the bot does while a CONFERENCE participant is ringing or joined</p>
enum BotPolicyOnJoin {

    // Same as <code>BOT_POLICY_ON_JOIN_KEEP</code>: the bot keeps talking
    BOT_POLICY_ON_JOIN_UNSPECIFIED = 0;

    // The bot is muted and does not listen while at least one participant is ringing or joined
    BOT_POLICY_ON_JOIN_PAUSE = 1;

    // The bot may still speak, but does not hear the participant (nor the caller)
    BOT_POLICY_ON_JOIN_PAUSE_LISTENING = 2;

    // The bot keeps talking and listening, and it WILL answer what the participant says
    BOT_POLICY_ON_JOIN_KEEP = 3;
}

// <p>State of an invited participant</p>
enum ParticipantState {

    // No state recorded
    PARTICIPANT_STATE_UNSPECIFIED = 0;

    // The participant&apos;s softphone is ringing
    PARTICIPANT_STATE_RINGING = 1;

    // The participant answered and is in the call
    PARTICIPANT_STATE_JOINED = 2;

    // The participant never joined; <code>end_reason</code> says why
    PARTICIPANT_STATE_FAILED = 3;

    // The participant left the call; <code>end_reason</code> says why
    PARTICIPANT_STATE_LEFT = 4;
}

// <p>A participant invited into a call</p>
message CallParticipant {

    // Identifier of the participant, 9 digits, unique among the project&apos;s live invites
    string participant_id = 1;

    // The invited softphone account:
    // <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;account_uuid&gt;</code></pre>
    string softphone_account_name = 2;

    // How the participant takes part
    ParticipantMode mode = 3;

    // State of the participant
    ParticipantState state = 4;

    // When the participant was invited
    google.protobuf.Timestamp invited_at = 5;

    // When the participant joined; unset if it never joined
    google.protobuf.Timestamp joined_at = 6;

    // When the participant failed or left; unset while ringing or joined
    google.protobuf.Timestamp left_at = 7;

    // Why the participant failed or left: <code>NOANSWER</code>, <code>BUSY</code>, <code>CHANUNAVAIL</code>,
    // <code>CALL_ENDED</code>, <code>REMOVED</code>, <code>HANGUP</code>, <code>HANDED_OVER</code>,
    // <code>JOIN_FAILED</code> or <code>TIMEOUT</code>
    string end_reason = 8;

    // Identity of who invited the participant (audit)
    string invited_by = 9;

    // Bot policy applied while this participant is ringing or joined
    BotPolicyOnJoin bot_policy = 10;
}

// <p>Request to invite a softphone account into a call</p>
message InviteToCallRequest {

    // VTSI project name of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Name of the connected call to invite into
    // For listener this is <pre><code>projects/&lt;project_uuid&gt;/listeners/&lt;listener_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    // For callers this is <pre><code>projects/&lt;project_uuid&gt;/callers/&lt;caller_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    string call_name = 2;

    // Softphone account of the same project to invite:
    // <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;account_uuid&gt;</code></pre>
    string softphone_account_name = 3;

    // How the participant takes part. Unspecified means <code>PARTICIPANT_MODE_CONFERENCE</code>
    ParticipantMode mode = 4;

    // How long the softphone may ring, in seconds, <code>5</code> to <code>120</code>. <code>0</code> means <code>30</code>
    int32 ring_timeout_s = 5;

    // What the bot does while the participant is ringing or joined. Unspecified means <code>BOT_POLICY_ON_JOIN_KEEP</code>
    // (the bot keeps talking)
    BotPolicyOnJoin bot_policy = 6;

    // Caller-ID display name shown on the softphone. Sanitized by the server; default
    // <code>ONDEWO &lt;listener or caller name&gt;</code>
    string caller_id_display_name = 7;

    // Optional idempotency key: a repeated request with the same <code>call_name</code> and <code>request_id</code>
    // returns the participant of the first request instead of inviting again
    string request_id = 8;
}

// <p>Response of <code>InviteToCall</code></p>
message InviteToCallResponse {

    // VTSI project name of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Name of the call
    string call_name = 2;

    // The invited participant
    CallParticipant participant = 3;

    // error message if you have any
    string error_message = 4;
}

// <p>Request to hang up a participant of a call</p>
message RemoveCallParticipantRequest {

    // VTSI project name of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Name of the call
    string call_name = 2;

    // Identifier of the participant (<code>CallParticipant.participant_id</code>)
    string participant_id = 3;
}

// <p>Response of <code>RemoveCallParticipant</code></p>
message RemoveCallParticipantResponse {

    // VTSI project name of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Name of the call
    string call_name = 2;

    // The participant after the request
    CallParticipant participant = 3;

    // error message if you have any
    string error_message = 4;
}

// <p>Request to mute the bot of a call and/or stop it listening</p>
message SetCallMediaControlRequest {

    // VTSI project name of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Name of the connected call
    string call_name = 2;

    // <code>CALL_MEDIA_SETTING_OFF</code> mutes the bot, <code>CALL_MEDIA_SETTING_ON</code> lets it speak again
    CallMediaSetting bot_voice = 3;

    // <code>CALL_MEDIA_SETTING_OFF</code> stops the bot listening, <code>CALL_MEDIA_SETTING_ON</code> resumes it
    CallMediaSetting bot_listening = 4;
}

// <p>Response of <code>SetCallMediaControl</code></p>
message SetCallMediaControlResponse {

    // VTSI project name of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Name of the call
    string call_name = 2;

    // Effective media control state after the request
    CallMediaControlState state = 3;

    // <code>true</code> if the effective state changed
    bool changed = 4;

    // error message if you have any
    string error_message = 5;
}

// <p>Mode of a call audio stream</p>
enum CallAudioMode {

    // Same as <code>CALL_AUDIO_MODE_LISTEN</code>
    CALL_AUDIO_MODE_UNSPECIFIED = 0;

    // Receive the call audio only
    CALL_AUDIO_MODE_LISTEN = 1;

    // Receive the caller&apos;s audio and send audio to the caller. Requires <code>take_over</code>
    CALL_AUDIO_MODE_TALK = 2;
}

// <p>Configuration of a call audio stream. The first request of <code>StreamCallAudio</code></p>
message StreamCallAudioConfig {

    // VTSI project name of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Name of the connected call
    string call_name = 2;

    // Mode of the stream. Unspecified means LISTEN
    CallAudioMode mode = 3;

    // Sample rate in Hz in both directions: <code>8000</code> or <code>16000</code>; <code>0</code> means <code>16000</code>.
    // Audio is LINEAR16 little-endian mono in 20 ms frames
    int32 sample_rate_hz = 4;

    // REQUIRED for TALK: the bot is muted and does not listen while the stream is connected
    bool take_over = 5;

    // Maximum duration of the stream in seconds. <code>0</code> means the server maximum
    int32 max_duration_s = 6;
}

// <p>One 20 ms frame of call audio</p>
message CallAudioFrame {

    // LINEAR16 little-endian mono samples, <code>sample_rate_hz * 0.02 * 2</code> bytes
    bytes pcm_s16le = 1;

    // Monotonic sequence number of the frame within its direction of the stream
    uint64 sequence = 2;
}

// <p>Request of <code>StreamCallAudio</code></p>
message StreamCallAudioRequest {

    // One of the following
    oneof request {

        // Configuration; must be the first request and is accepted only once
        StreamCallAudioConfig config = 1;

        // Agent audio to send to the caller (TALK only)
        CallAudioFrame audio = 2;

        // <code>true</code>: the agent&apos;s audio is not sent to the caller until set to <code>false</code>
        bool agent_muted = 3;
    }
}

// <p>Why a call audio stream ended</p>
enum CallAudioEndReason {

    // No reason recorded
    CALL_AUDIO_END_REASON_UNSPECIFIED = 0;

    // The client cancelled or half-closed the stream
    CALL_AUDIO_END_REASON_CLIENT_CLOSED = 1;

    // The call ended
    CALL_AUDIO_END_REASON_CALL_ENDED = 2;

    // The call was transferred
    CALL_AUDIO_END_REASON_CALL_TRANSFERRED = 3;

    // The maximum duration was reached
    CALL_AUDIO_END_REASON_MAX_DURATION = 4;

    // The client did not read the audio in time
    CALL_AUDIO_END_REASON_STALLED = 5;

    // An internal error ended the stream
    CALL_AUDIO_END_REASON_INTERNAL = 6;
}

// <p>Sent once when a call audio stream is connected</p>
message CallAudioStarted {

    // Identifier of the stream (audit correlation)
    string stream_id = 1;

    // Sample rate in Hz in both directions
    int32 sample_rate_hz = 2;

    // Frame length in milliseconds
    int32 frame_ms = 3;

    // Mode of the stream
    CallAudioMode mode = 4;
}

// <p>Counters of a call audio stream, sent periodically</p>
message CallAudioStats {

    // Frames sent to the client
    uint64 frames_sent = 1;

    // Frames to the client dropped because the client read too slowly
    uint64 frames_dropped = 2;

    // Frames received from the client
    uint64 frames_received = 3;

    // Playback underruns of the agent audio
    uint64 underruns = 4;

    // Frames from the client discarded because the playback buffer was full
    uint64 frames_discarded = 5;
}

// <p>Sent once when a call audio stream ends normally</p>
message CallAudioEnded {

    // Why the stream ended
    CallAudioEndReason reason = 1;

    // Optional detail, a stable token
    string detail = 2;
}

// <p>Response of <code>StreamCallAudio</code> and <code>ListenCallAudio</code></p>
message StreamCallAudioResponse {

    // One of the following
    oneof response {

        // The stream is connected
        CallAudioStarted started = 1;

        // Call audio
        CallAudioFrame audio = 2;

        // Stream counters
        CallAudioStats stats = 3;

        // The stream ended
        CallAudioEnded ended = 4;
    }
}

// <p>Request of <code>ListenCallAudio</code></p>
message ListenCallAudioRequest {

    // Configuration of the stream; <code>mode</code> must be LISTEN or unspecified and <code>take_over</code> false
    StreamCallAudioConfig config = 1;
}

// Request to transfer multiple calls
message TransferCallsRequest{

    // VTSI project name with which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Responses to transfer multiple calls to a phone number or voip number
    repeated TransferCallRequest transfer_call_requests = 2;

}

// Response to transfer a call to a phone number or voip number
message TransferCallsResponse {

    // VTSI project name with which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // The responses for each transfer call request
    repeated TransferCallResponse transfer_call_responses = 2;

    // overall error message if you have any so if it's unhealthy
    string error_message = 3;

}

// Request to get a call instance&apos;s call logs
message GetCallRequest {

    // VTSI project name with which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // call name
    // For listener this is <pre><code>projects/&lt;project_uuid&gt;/listeners/&lt;listener_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    // For callers this is <pre><code>projects/&lt;project_uuid&gt;/callers/&lt;caller_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    string call_name = 2;

    // you can specify the view to be shallow or full .. see above for more info
    optional CallView call_view = 3;

    // Optional. Partial response: the field paths to populate in the returned <code>Call</code>, relative to the
    // <code>Call</code> message, e.g. <code>call_type</code>, <code>phone_number</code>, <code>labels</code>,
    // <code>sip_status.status_type</code>. Nested paths through singular message fields are allowed; a path
    // below a repeated or map field is not. <code>name</code> is always populated. Unset or empty returns every
    // field the <code>call_view</code> populates. An unknown path is rejected with <code>INVALID_ARGUMENT</code>
    // naming it. Applied after the <code>call_view</code> and the server&apos;s role-based redaction of
    // <code>common_services_config</code>, so it can only narrow the response and never populates a field that
    // was left empty.
    google.protobuf.FieldMask field_mask = 4;
}

// Call view options
enum CallView {

    // Gives only minimum info about the call
    MINIMUM = 0;

    // Gives further basic info like call name, start_time, end_time, current sip status
    SHALLOW = 1;

    // Gives you the full info with status history and the services statuses
    FULL = 2;
}

// Call view options
enum CallStatus {

    // Unspecified call status
    CALL_STATUS_UNSPECIFIED = 0;

    // Call is active
    CALL_STATUS_ACTIVE = 1;

    // Call is inactive
    CALL_STATUS_INACTIVE = 2;
}


// CallType
enum CallType {

    // Both listener and caller
    BOTH = 0;

    // Listener
    LISTENER = 1;

    // Caller
    CALLER = 2;

    // Scheduled Caller
    SCHEDULED_CALLER = 3;
}

// Call
message Call {

    // call name
    // For listener this is <pre><code>projects/&lt;project_uuid&gt;/listeners/&lt;listener_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    // For callers this is <pre><code>projects/&lt;project_uuid&gt;/callers/&lt;caller_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>
    string name = 1;

    // sip account used
    string sip_account = 2;

    // container name which you get from docker ps
    string container_name = 3;

    // Listener or caller enum .. if not specified
    CallType call_type = 4;

    // callee voip id or callee phone number
    string phone_number = 5;

    // start time of log
    google.protobuf.Timestamp start_time = 6;

    // end time of log
    google.protobuf.Timestamp end_time = 7;

    // current sip status type
    ondewo.sip.SipStatus.StatusType sip_status_type = 8;

    // current sip status
    optional ondewo.sip.SipStatus sip_status = 9;

    // sip status history
    optional ondewo.sip.SipStatusHistoryResponse sip_status_history = 10;

    // All container health statuses
    optional AllServicesStatuses services_statuses = 11;

    // Is a call active or not
    bool active = 12;

    // VTSI project name which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 13;

    // Detailed configuration of the services used for the call such as S2T, T2S, NLU, SIP and CSI
    optional CommonServicesConfig common_services_config = 14;

    // SIP port of the call
    optional int32 sip_port = 15;

    // CSI port of the call
    optional int32 csi_port = 16;

    // NLU session name
    optional string nlu_session_name = 17;

    // Messages for each of the Intent.Message.Platform were sent to the user
    optional ondewo.nlu.Intent.Message.Platform platforms = 18;

    // Optional: Whether the callee should be called again later, set only when the answering machine
    // detection (AMD) ended the call: true for an answering machine or a network announcement hung up
    // on without a voice message, false once a voice message was left and false for a fax.
    // Unset when AMD did not end the call.
    // The AMD verdict, cause and confidence of the call are in sip_status.amd_result.
    // No call is redialled automatically; the marker is for the campaign logic of the client
    optional bool redial_recommended = 19;

    // Optional: Reason of redial_recommended, set together with it. One of
    // "answering_machine", "network_announcement" or "fax"
    optional string redial_reason = 20;

    // Optional: Description of how a call ended by the answering machine detection (AMD) ended, i.e. the
    // description of its terminal ondewo.sip.SipStatus.StatusType.OUTGOING_CALL_FINISHED status. One of
    // "Answering machine detected with hang up",
    // "Answering machine detected with left voice message and hang up",
    // "Answering machine detected, call ended by the answering machine" or
    // "Answering machine detected, call ended by the answering machine after leaving a voice message".
    // Unset when AMD did not end the call
    optional string answering_machine_detection_end_description = 21;

    // Media control state of the call (bot muted, listening paused, connected audio streams, joined participants).
    // Set in the SHALLOW and FULL views
    CallMediaControlState media_control = 22;

    // Participants invited into the call. FULL view: all of them; SHALLOW view: those still ringing or joined
    repeated CallParticipant participants = 23;

    // The last transfer attempt of the call; unset if there was none. Set in the SHALLOW and FULL views
    CallTransferRecord last_transfer = 24;

    // Identifier the call&apos;s SIP container minted for the call (<code>ondewo.sip.SipStatus.call_id</code>). Empty until
    // the call was identified; call control requests are refused (<code>call-not-yet-identified</code>) until then.
    // Set in the SHALLOW and FULL views
    string sip_call_id = 25;

    // Client-defined descriptive labels of the call, e.g. <code>{"ticket": "4711", "outcome": "callback"}</code>.
    // Empty until a client sets them; the server never sets or interprets them. Written ONLY by
    // <code>UpdateCall</code> / <code>UpdateCalls</code> with the <code>update_mask</code> path
    // <code>labels</code>, which REPLACES the whole map (an empty map clears it); a path below it (e.g.
    // <code>labels.ticket</code>) is rejected. Bounds, each refused with <code>INVALID_ARGUMENT</code> naming
    // the label: at most 64 entries; a key of 1 to 63 characters from <code>[a-z0-9_.-]</code>, starting with a
    // lowercase letter; a value of at most 255 printable characters (Unicode allowed, no control characters).
    // Stored with the call record, so they survive the end of the call and are kept as long as the record.
    // This is the only mutable field of a <code>Call</code>: it exists so that a call can be annotated without
    // anything about the live call being changed. Set in the SHALLOW and FULL views.
    map<string, string> labels = 26;

}

// Definition of a CallFilter, representing filters for querying calls.
message CallFilter {

    // Optional: Filter by call names.
    repeated string call_names = 1;

    // Optional: Filter by NLU session names.
    repeated string nlu_session_names = 2;

    // Optional: Filter by SIP accounts.
    repeated string sip_accounts = 3;

    // Optional: Filter by phone numbers.
    repeated string phone_numbers = 4;

    // Optional: Filter by container names.
    repeated string container_names = 5;

    // Optional: Filter by SIP ports.
    repeated string sip_ports = 6;

    // Optional: Filter by CSI ports.
    repeated string csi_ports = 7;

    // Optional: Filter by call types (both by default, or only listeners, or only callers).
    repeated CallType call_types = 8;

    // Optional: Filter based on SIP status types.
    repeated ondewo.sip.SipStatus.StatusType sip_status_types = 9;

    // Optional: Filter based on active or inactive calls.
    optional CallStatus call_status = 10;

    // Optional: Start time of the log.
    optional google.protobuf.Timestamp start_time = 11;

    // Optional: End time of the log.
    optional google.protobuf.Timestamp end_time = 12;

    // Optional: Match only sessions for which the duration in seconds is larger or equal.
    optional float duration_in_s_min = 13;

    // Optional: Match only calls for which the duration in seconds is smaller or equal.
    optional float duration_in_s_max = 14;

    // Optional: Platform responses sent to the user. Default is text: <code>Platform.PLATFORM_UNSPECIFIED</code>
    repeated ondewo.nlu.Intent.Message.Platform platforms = 15;

    // Optional: Only the calls of one campaign, i.e. the calls placed by the attempts of its campaign calls
    // (<code>CampaignCallAttempt.call_name</code>), whichever way the campaign call was added. An attempt
    // whose start failed placed no call and contributes none. Combined with the other filters by AND (a
    // campaign&apos;s calls are all <code>CALLER</code> calls). Neither set means any call, as before 9.1.0.
    // Resolved within <code>ListCallsRequest.vtsi_project_name</code>; a <code>page_token</code> is valid only
    // with the same campaign selector.
    // <p>Errors: <code>INVALID_ARGUMENT</code> for a malformed <code>campaign_name</code>, a campaign of another
    // project than <code>ListCallsRequest.vtsi_project_name</code>, or an empty
    // <code>campaign_display_name</code> sent as the set member; <code>NOT_FOUND</code> for an unknown
    // campaign.</p>
    oneof campaign {

        // Resource name of the campaign.
        // The format is: <pre><code>projects/&lt;project_uuid&gt;/campaigns/&lt;campaign_uuid&gt;</code></pre>
        string campaign_name = 16;

        // Exact, case-sensitive <code>display_name</code> of the campaign, resolved within
        // <code>ListCallsRequest.vtsi_project_name</code>.
        string campaign_display_name = 17;
    }

}


// Request to list calls
message ListCallsRequest{

    // VTSI project name with which to perform the call of the form <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // you can specify the view to be shallow or full .. see above for more info
    optional CallView call_view = 2;

    // Optional. A filter to narrow the response down to sessions of interest.
    optional CallFilter call_filter = 3;

    // Optional. The next_page_token value returned from a previous list request.
    // Example: "current_index-1--page_size-20"
    optional string page_token = 4;

    // Optional. Partial response: the field paths to populate in every returned <code>Call</code>, relative
    // to the <code>Call</code> message (no <code>calls.</code> prefix), e.g. <code>call_type</code>,
    // <code>phone_number</code>, <code>start_time</code>. Nested paths through singular message fields are
    // allowed; a path below a repeated or map field is not. <code>name</code> is always populated. Unset or
    // empty returns every field the <code>call_view</code> populates. An unknown path is rejected with
    // <code>INVALID_ARGUMENT</code> naming it. Applied after the <code>call_view</code> and the
    // server&apos;s role-based redaction of <code>common_services_config</code>, so it can only narrow the
    // response and never populates a field that was left empty. Not part of the paging contract: a
    // <code>page_token</code> stays valid with another mask.
    google.protobuf.FieldMask field_mask = 5;

}

// Response to list all VoipInfos
message ListCallsResponse{

    // The list of calls returned in the response
    repeated Call calls = 1;

    // Token to retrieve the next page of results.
    // This field is a string that holds a token for fetching the next page of results.
    // If there are no more results in the list, this field will be empty.
    string next_page_token = 2;

}

// The request message for <a href="index.html#ondewo.vtsi.Calls.UpdateCall">Calls.UpdateCall</a>.
message UpdateCallRequest {

    // The call to update, identified by <code>call.name</code>
    // (<pre><code>projects/&lt;project_uuid&gt;/callers/&lt;caller_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre> or
    // <pre><code>projects/&lt;project_uuid&gt;/listeners/&lt;listener_uuid&gt;/calls/&lt;call_uuid&gt;</code></pre>),
    // carrying the new <code>labels</code>. Every other field is ignored.
    Call call = 1;

    // Required. Paths relative to <code>Call</code>, WITHOUT a <code>call.</code> prefix. The only updatable
    // path is <code>labels</code>, which replaces the whole map with <code>call.labels</code> (unset or empty
    // clears it). An empty mask, any other path (every other field of a <code>Call</code> is output only) or a
    // path below <code>labels</code> (e.g. <code>labels.ticket</code>) is rejected with
    // <code>INVALID_ARGUMENT</code> naming the path, and nothing is written. Labels outside the bounds of
    // <code>Call.labels</code> are rejected with <code>INVALID_ARGUMENT</code> naming the label.
    google.protobuf.FieldMask update_mask = 2;

    // Optional. Partial response: the field paths to populate in <code>UpdateCallResponse.call</code>, relative
    // to the <code>Call</code> message (no <code>call.</code> prefix), e.g. <code>labels</code>,
    // <code>active</code>. Nested paths through singular message fields are allowed; a path below a repeated or
    // map field is not. <code>call.name</code> and the other fields of the response are always populated. Unset
    // or empty returns every field. An unknown path is rejected with <code>INVALID_ARGUMENT</code> naming it,
    // before anything is written. The returned call is the one <code>GetCall</code> with
    // <code>call_view = FULL</code> would return after the update, including the server&apos;s role-based
    // redaction of <code>common_services_config</code>, and the mask is applied after that redaction. In an
    // entry of <code>UpdateCallsRequest</code> it must be unset (use <code>UpdateCallsRequest.field_mask</code>).
    google.protobuf.FieldMask field_mask = 3;
}

// The response message for <a href="index.html#ondewo.vtsi.Calls.UpdateCall">Calls.UpdateCall</a>, and one entry
// of <code>UpdateCallsResponse</code>.
message UpdateCallResponse {

    // The name of the call the request named. Always populated, also for a failed entry of
    // <code>UpdateCalls</code>.
    string name = 1;

    // The call after the update, shaped by the request&apos;s <code>field_mask</code>. Unset for a failed entry.
    Call call = 2;

    // Empty on success; as <code>UpdateCallerResponse.error_message</code>.
    string error_message = 3;
}

// The request message for <a href="index.html#ondewo.vtsi.Calls.UpdateCalls">Calls.UpdateCalls</a>.
// <p>Rejected as a whole exactly like <code>UpdateCallersRequest</code> (with calls instead of callers: no entry,
// more than 1000 entries, two entries naming the same call, a call of another project than
// <code>vtsi_project_name</code>, an entry with its own <code>field_mask</code>, an unknown
// <code>field_mask</code> path); every other error is reported per entry.</p>
message UpdateCallsRequest {

    // VTSI project of every call of the request.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // The updates, applied one by one and each like <code>UpdateCall</code>.
    repeated UpdateCallRequest update_call_requests = 2;

    // Optional. Partial response: the field paths to populate in the <code>call</code> of EVERY entry of
    // <code>UpdateCallsResponse.update_call_responses</code>, relative to the <code>Call</code> message (no
    // prefix), as in <code>UpdateCallRequest.field_mask</code>. <code>call.name</code>, <code>name</code> and
    // <code>error_message</code> of each entry and the response&apos;s own fields are always populated.
    google.protobuf.FieldMask field_mask = 3;
}

// The response message for <a href="index.html#ondewo.vtsi.Calls.UpdateCalls">Calls.UpdateCalls</a>.
message UpdateCallsResponse {

    // VTSI project of the request.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // One entry per entry of the request, in request order.
    repeated UpdateCallResponse update_call_responses = 2;

    // A summary when at least one entry failed, empty when every entry succeeded; as
    // <code>UpdateCallersResponse.error_message</code>.
    string error_message = 3;
}

// Status of ondewo-sip instance
message AllServicesStatuses {

    // health status for sip
    ServiceStatus status_sip = 1;

    // status of the associated asterisk server
    ServiceStatus status_asterisk = 2;

    // status of the nlu instance associated with the call
    ServiceStatus status_nlu = 3;

    // status of the associated speech-to-text service
    ServiceStatus status_stt = 4;

    // status of the associated text-to-speech service
    ServiceStatus status_tts = 5;
}

// Status of service
message ServiceStatus {

    // health status
    bool healthy = 1;

    // error messages if you have any so if it's unhealthy
    string error_message = 2;
}

// The status of one caller, listener or scheduled caller, as streamed by the status streams.
message CallResourceStatus {

    // The caller, listener or scheduled caller.
    string resource_name = 1;

    // CALLER, LISTENER or SCHEDULED_CALLER.
    CallType call_type = 2;

    // Its current or last call. Empty when it has none.
    string call_name = 3;

    // Whether its call is active.
    bool active = 4;

    // SIP status of its current or last call.
    ondewo.sip.SipStatus.StatusType sip_status_type = 5;

    // Description of that SIP status.
    string sip_status_description = 6;

    // Start of its current or last call.
    google.protobuf.Timestamp start_time = 7;

    // End of its last call. Unset while a call runs.
    google.protobuf.Timestamp end_time = 8;

    // Callee or caller number of its current or last call.
    string phone_number = 9;

    // For SCHEDULED_CALLER: its lifecycle state.
    ScheduledCallerStatus scheduled_caller_status = 10;

    // For SCHEDULED_CALLER: its scheduled time.
    google.protobuf.Timestamp scheduled_time = 11;

    // The campaign it belongs to, if any.
    string campaign_name = 12;

    // For SCHEDULED_CALLER: why it failed.
    string error_message = 13;
}

// The request message for <code>Calls.StreamCallerStatus</code>.
message StreamCallerStatusRequest {

    // VTSI project. The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Only these callers. Empty means every caller of the project.
    repeated string caller_names = 2;

    // Only callers whose call is active.
    bool active_only = 3;
}

// The request message for <code>Calls.StreamListenerStatus</code>.
message StreamListenerStatusRequest {

    // VTSI project. The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Only these listeners. Empty means every listener of the project.
    repeated string listener_names = 2;

    // Only listeners whose call is active.
    bool active_only = 3;
}

// The request message for <code>Calls.StreamScheduledCallerStatus</code>.
message StreamScheduledCallerStatusRequest {

    // VTSI project. The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Only these scheduled callers. Empty means every scheduled caller of the project.
    repeated string scheduled_caller_names = 2;

    // Only scheduled callers in these states. Empty means every state.
    repeated ScheduledCallerStatus statuses = 3;

    // Only scheduled callers of this campaign. Empty means any.
    string campaign_name = 4;
}

// The response message of the three status streams.
message StreamCallResourceStatusResponse {

    // Resources that changed (every matching resource in the snapshot).
    repeated CallResourceStatus statuses = 1;

    // Resources that no longer exist or no longer match.
    repeated string removed_resource_names = 2;

    // True on the first message, which carries every matching resource.
    bool snapshot = 3;

    // True when the snapshot was cut at the server limit (5000 resources).
    bool snapshot_truncated = 4;

    // Set on the last message when the server ended the stream. Empty otherwise.
    string end_reason = 5;
}
