syntax = "proto3";

package ondewo.vtsi;
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
// <code>ondewo.vtsi.VtsiProjectSortingMode</code> is reused rather than redeclared: proto3 enum values
// are scoped to the package, so a second <code>ASCENDING</code> / <code>DESCENDING</code> pair cannot exist.
import "ondewo/vtsi/projects.proto";

// <p>ONDEWO VTSI API</p>
// <p>Manages the SOFTPHONE ACCOUNTS of a VTSI project: SIP accounts on the project&apos;s Asterisk that
// a human uses from a softphone such as Zoiper, to call into the project&apos;s listeners or to be reached
// by the project.</p>
// <p>A softphone account is NEVER one of the <code>ondewo000N</code> accounts the per-call ondewo-sip
// containers register with: it has its own SIP credentials, its own endpoint on the Asterisk and, for
// <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>, its own client certificate issued by the
// project&apos;s SOFTPHONE certificate authority.</p>
// <p><b>Secrets are handed out exactly once.</b> The SIP password and the password-protected PKCS#12
// bundle carrying the client private key appear only in the responses of
// <code>CreateSoftphoneAccount</code> and <code>RotateSoftphoneCredentials</code>. VTSI keeps no copy of
// the private key or of the PKCS#12 password, and stores the SIP password only in the form the Asterisk
// needs to verify a SIP digest. No other RPC returns a secret; a lost private key or password is
// recovered by rotating it.</p>
// <p>Errors are reported as gRPC status codes, not as <code>error_message</code> fields:
// <code>INVALID_ARGUMENT</code> for a malformed name, filter, field mask or value;
// <code>NOT_FOUND</code> for an unknown project, account or certificate;
// <code>ALREADY_EXISTS</code> for a <code>sip_username</code> already taken in the project;
// <code>FAILED_PRECONDITION</code> when the project or the account is in a state that does not allow the
// operation (each RPC names its cases); <code>ABORTED</code> when a concurrent change to the same account
// won, in which case nothing was stored and the request can be retried.</p>
// <p><b>A change that reduces access is enforced before it is acknowledged.</b> When
// <code>UpdateSoftphoneAccount</code>, <code>DeleteSoftphoneAccount</code> or
// <code>RevokeSoftphoneCertificate</code> is stored but the running Asterisk of a deployed project could
// not be updated, the RPC fails with <code>FAILED_PRECONDITION</code>; the stored change is applied by
// the next successful change or deployment. <code>CreateSoftphoneAccount</code> and
// <code>RotateSoftphoneCredentials</code> return their one-time secrets even then.</p>
service Softphones {

    //////////////////////////////////////////////////////////////////////////////
    // Softphone account endpoints
    //////////////////////////////////////////////////////////////////////////////

    // <p>Creates a softphone account in a VTSI project, generates its SIP password and, for
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>, issues its first client certificate.
    // The response carries the ONE-TIME secrets; they cannot be retrieved again.</p>
    // <p>If the project is deployed the account is applied to the running Asterisk; otherwise it is
    // applied on the next deployment.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the project does not exist; <code>ALREADY_EXISTS</code> if the
    // <code>sip_username</code> is taken in the project; <code>INVALID_ARGUMENT</code> for an invalid or
    // reserved <code>sip_username</code>, an output-only field that was set, or an out-of-range value;
    // <code>FAILED_PRECONDITION</code> if the project is being deleted, or, for
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>, if the project has no Asterisk port yet
    // or its SOFTPHONE certificate authority is unusable (a redeployment mints a new one).</p>
    // <p>The account is reachable on either TLS port only from the project&apos;s
    // <code>softphone_permit_cidrs</code> (default: the server&apos;s list, private networks unless the
    // operator changed it); see <code>AsteriskConfigsVariables.softphone_permit_cidrs</code>.</p>
    rpc CreateSoftphoneAccount (CreateSoftphoneAccountRequest) returns (CreateSoftphoneAccountResponse);

    // <p>Returns a softphone account. Never returns a secret.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the account does not exist; <code>INVALID_ARGUMENT</code> for a
    // malformed name or an unknown <code>field_mask</code> path.</p>
    rpc GetSoftphoneAccount (GetSoftphoneAccountRequest) returns (SoftphoneAccount);

    // <p>Updates the mutable fields of a softphone account named by <code>update_mask</code>. Credentials
    // are not changed here; use <code>RotateSoftphoneCredentials</code>.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the account does not exist; <code>INVALID_ARGUMENT</code> for an
    // empty mask, an unknown, output-only or immutable path, or an out-of-range value;
    // <code>FAILED_PRECONDITION</code> when switching to
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code> while the account has no
    // <code>SOFTPHONE_CERTIFICATE_STATUS_ACTIVE</code> certificate, or if the project is being deleted.</p>
    // <p>The account is reachable on either TLS port only from the project&apos;s
    // <code>softphone_permit_cidrs</code> (default: the server&apos;s list, private networks unless the
    // operator changed it); see <code>AsteriskConfigsVariables.softphone_permit_cidrs</code>.</p>
    rpc UpdateSoftphoneAccount (UpdateSoftphoneAccountRequest) returns (SoftphoneAccount);

    // <p>Deletes a softphone account. Its endpoint is removed from the Asterisk, its registrations are
    // dropped and every certificate it holds is revoked. Deletion is permanent.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the account does not exist.</p>
    rpc DeleteSoftphoneAccount (DeleteSoftphoneAccountRequest) returns (DeleteSoftphoneAccountResponse);

    // <p>Lists the softphone accounts of a VTSI project, filtered, sorted and paged. Never returns a
    // secret.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the project does not exist; <code>INVALID_ARGUMENT</code> for an
    // invalid filter, an unknown <code>field_mask</code> path, a negative <code>page_size</code> or a
    // <code>page_token</code> that was not issued for the same project, filter and sorting.</p>
    rpc ListSoftphoneAccounts (ListSoftphoneAccountsRequest) returns (ListSoftphoneAccountsResponse);

    // <p>Rotates the SIP password and/or the client certificate of a softphone account and returns the new
    // ONE-TIME secrets. <b>Every rotation rotates the SIP password</b>, including one that asked only for
    // <code>rotate_certificate</code>: the Asterisk has no certificate revocation list, so a previous
    // certificate stops being usable for this account only because the password it was issued with
    // stops working. The new password takes effect immediately and drops the account&apos;s current
    // registrations, so every softphone using it must be reconfigured. A rotated certificate moves the
    // previous <code>SOFTPHONE_CERTIFICATE_STATUS_ACTIVE</code> certificate to
    // <code>SOFTPHONE_CERTIFICATE_STATUS_SUPERSEDED</code>. A rotation also unlocks an account that
    // <code>RevokeSoftphoneCertificate</code> locked (a <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>
    // account only once it again holds an ACTIVE certificate).</p>
    // <p>Rotating the certificate of a <code>SOFTPHONE_TRANSPORT_SECURITY_SERVER_TLS_ONLY</code> account is
    // allowed: it issues the certificate that a later switch to
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code> requires, and rotates the password too.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the account does not exist; <code>INVALID_ARGUMENT</code> if
    // neither <code>rotate_sip_password</code> nor <code>rotate_certificate</code> is set;
    // <code>FAILED_PRECONDITION</code> if the project is being deleted, or, for
    // <code>rotate_certificate</code>, if the project has no Asterisk port yet or its SOFTPHONE
    // certificate authority is unusable.</p>
    rpc RotateSoftphoneCredentials (RotateSoftphoneCredentialsRequest) returns (RotateSoftphoneCredentialsResponse);

    //////////////////////////////////////////////////////////////////////////////
    // Softphone certificate endpoints
    //////////////////////////////////////////////////////////////////////////////

    // <p>Lists softphone client certificates, either of one softphone account or of a whole VTSI project,
    // filtered and paged, newest first. Only public material is returned.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the project or account does not exist;
    // <code>INVALID_ARGUMENT</code> if no scope is set, for an invalid filter, an unknown
    // <code>field_mask</code> path, a negative <code>page_size</code> or a foreign
    // <code>page_token</code>.</p>
    rpc ListSoftphoneCertificates (ListSoftphoneCertificatesRequest) returns (ListSoftphoneCertificatesResponse);

    // <p>Returns one softphone client certificate. Only public material is returned.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the certificate does not exist; <code>INVALID_ARGUMENT</code> for
    // a malformed name or an unknown <code>field_mask</code> path.</p>
    rpc GetSoftphoneCertificate (GetSoftphoneCertificateRequest) returns (SoftphoneCertificate);

    // <p>Revokes a softphone client certificate. The Asterisk has no certificate revocation list, so
    // revocation is enforced on the account&apos;s SIP password rather than on the certificate: a revoked
    // certificate still completes the TLS handshake on the project&apos;s mutual-TLS port, but it no longer
    // gets its holder an account.</p>
    // <p>Revoking the ACTIVE certificate of an account LOCKS the account, whatever its transport
    // security: it is removed from the Asterisk and its registrations are dropped until
    // <code>RotateSoftphoneCredentials</code> issues a new password (and, for
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>, a new certificate). Revoking a
    // SUPERSEDED certificate records the revocation only; its password was already rotated away.
    // Revoking an already revoked certificate is idempotent and keeps the original revocation time and
    // reason.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the certificate does not exist; <code>INVALID_ARGUMENT</code>
    // for a malformed name or an over-long reason.</p>
    rpc RevokeSoftphoneCertificate (RevokeSoftphoneCertificateRequest) returns (SoftphoneCertificate);

    //////////////////////////////////////////////////////////////////////////////
    // Softphone provisioning endpoints
    //////////////////////////////////////////////////////////////////////////////

    // <p>Returns everything needed to configure a softphone for an account: server, port, transport,
    // outbound proxy, SIP identity, SRTP mode, codecs, the certificate authority to trust, which client
    // certificate to import, and step-by-step Zoiper instructions. It never contains the SIP password or
    // the private key; those were returned once by <code>CreateSoftphoneAccount</code> or
    // <code>RotateSoftphoneCredentials</code>.</p>
    // <p>Errors: <code>NOT_FOUND</code> if the account does not exist; <code>FAILED_PRECONDITION</code> if
    // the project is not <code>DEPLOYED</code> (the host and ports describe a running Asterisk), or if a
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code> account has no
    // <code>SOFTPHONE_CERTIFICATE_STATUS_ACTIVE</code> certificate.</p>
    rpc GetSoftphoneProvisioning (GetSoftphoneProvisioningRequest) returns (SoftphoneProvisioning);
}

//////////////////////////////////////////////////////////////////////////////
// Enums
//////////////////////////////////////////////////////////////////////////////

// How a softphone account secures its SIP signalling to the project&apos;s Asterisk. Both modes use TLS
// for signalling, SRTP for media and SIP digest authentication with the account&apos;s own credentials;
// they differ in which TLS port the softphone connects to and whether it must present a client
// certificate.
enum SoftphoneTransportSecurity {

    // Unspecified: identical to <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code> on create.
    // The zero value is the stronger mode, so a caller that says nothing gets mutual TLS. Never returned
    // on a stored account.
    SOFTPHONE_TRANSPORT_SECURITY_UNSPECIFIED = 0;

    // Mutual TLS. The softphone connects to the project&apos;s internal TLS port, which requires a client
    // certificate, and presents the certificate VTSI issued for this account from the project&apos;s
    // SOFTPHONE certificate authority. SIP digest authentication is required in addition.
    // The Asterisk cannot bind an account to one port: the account&apos;s PASSWORD alone can still
    // REGISTER over the external TLS port and so receive the account&apos;s incoming calls, while every
    // call it places that did not arrive over TLS on the internal port is refused with 403. Treat the
    // password as a full credential of the account.
    SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE = 1;

    // Server-authenticated TLS only. The softphone connects to the project&apos;s external TLS port, which
    // does not ask for a client certificate, and authenticates with SIP digest alone. Intended for
    // softphone editions without client-certificate support, e.g. some Zoiper editions. A call it places
    // over a cleartext transport is refused with 403.
    SOFTPHONE_TRANSPORT_SECURITY_SERVER_TLS_ONLY = 2;
}

// Lifecycle status of a softphone client certificate.
enum SoftphoneCertificateStatus {

    // Unspecified. Never returned; in a filter it matches nothing and is rejected with
    // <code>INVALID_ARGUMENT</code>.
    SOFTPHONE_CERTIFICATE_STATUS_UNSPECIFIED = 0;

    // The account&apos;s current certificate. It is accepted by the project&apos;s Asterisk until it
    // expires, or until the project&apos;s Asterisk port changes: the certificate authorities belong to
    // the port, so a port change voids every issued certificate (the stored status is not changed; rotate
    // the certificate). An account holds at most one ACTIVE certificate.
    SOFTPHONE_CERTIFICATE_STATUS_ACTIVE = 1;

    // Replaced by a newer certificate through <code>RotateSoftphoneCredentials</code>, which rotated the
    // account&apos;s password with it. Still completes a TLS handshake until it expires, but no longer
    // gets its holder the account.
    SOFTPHONE_CERTIFICATE_STATUS_SUPERSEDED = 2;

    // Explicitly revoked through <code>RevokeSoftphoneCertificate</code>, or because its account was
    // deleted. Still completes a TLS handshake until it expires (the Asterisk has no revocation list),
    // but no longer gets its holder the account.
    SOFTPHONE_CERTIFICATE_STATUS_REVOKED = 3;
}

// Media encryption a softphone must use.
enum SoftphoneSrtpMode {

    // Unspecified. Never returned.
    SOFTPHONE_SRTP_MODE_UNSPECIFIED = 0;

    // SRTP with SDES key exchange (keys in the SDP, protected by the TLS signalling), MANDATORY: an
    // offer without SRTP is rejected by the Asterisk. In Zoiper: Media encryption <code>SRTP</code>
    // (SDES).
    SOFTPHONE_SRTP_MODE_SDES_MANDATORY = 1;
}

//////////////////////////////////////////////////////////////////////////////
// Resources
//////////////////////////////////////////////////////////////////////////////

// A SIP account on a VTSI project&apos;s Asterisk for a human using a softphone. Never carries a
// secret.
message SoftphoneAccount {

    // Output only. Resource name of the softphone account.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;</code></pre>
    // Ignored on create; identifies the account on update.
    string name = 1;

    // Output only. The <code>&lt;softphone_account_uuid&gt;</code> part of <code>name</code>.
    string softphone_account_id = 2;

    // Output only. Resource name of the VTSI project the account belongs to.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 3;

    // Human-readable name, shown as the caller name of calls from this softphone. At most 128
    // characters. Updatable.
    string display_name = 4;

    // Required on create, immutable afterwards. The SIP user (extension) of the account: the user part
    // of its address of record and its SIP digest username. 1 to 64 characters of
    // <pre><code>[A-Za-z0-9._-]</code></pre>, starting with a letter or digit, unique within the
    // project. Names starting with <code>ondewo</code> (case-insensitive) are reserved for the per-call
    // ondewo-sip container accounts and are rejected with <code>INVALID_ARGUMENT</code>.
    string sip_username = 5;

    // How the softphone secures its connection. Unset on create means
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>. Updatable; switching to
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code> requires an ACTIVE certificate.
    SoftphoneTransportSecurity transport_security = 6;

    // Whether the account may register and place or receive calls. A disabled account keeps its
    // credentials and certificates, but the Asterisk refuses its registrations and calls and its current
    // registrations are dropped. Unset on create means <code>true</code>. Updatable.
    optional bool enabled = 7;

    // Maximum number of simultaneous registrations (devices) of this account. <code>0</code> on create
    // means the server default of 1; the allowed range is 1 to 10. Updatable.
    int32 max_contacts = 8;

    // Free-form labels for organising and filtering accounts, e.g. <code>team: support</code>. Keys: 1 to
    // 63 characters of <pre><code>[a-z0-9_.-]</code></pre>, starting with a letter; values: at most 256
    // characters; at most 64 entries. Updatable (the whole map is replaced).
    map<string, string> labels = 9;

    // Asterisk dialplan extensions or patterns this softphone may dial, e.g. <code>100</code> or
    // <code>_1XX</code>. Empty means the project default: the project&apos;s own listener extensions,
    // and never the SIP trunk. Each entry is at most 64 characters of
    // <pre><code>[A-Za-z0-9_.!*#+\[\]-]</code></pre>. Updatable (the whole list is replaced).
    repeated string allowed_destinations = 10;

    // Output only. Resource name of the account&apos;s ACTIVE client certificate, empty when it has none.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;/certificates/&lt;certificate_uuid&gt;</code></pre>
    string current_certificate_name = 11;

    // Output only. SHA-256 fingerprint of the ACTIVE client certificate: 32 upper-case hex bytes separated
    // by colons, as displayed by <code>openssl x509 -fingerprint -sha256</code>. Empty when there is no
    // ACTIVE certificate.
    string current_certificate_sha256_fingerprint = 12;

    // Output only. Expiry (notAfter) of the ACTIVE client certificate. Unset when there is none.
    google.protobuf.Timestamp current_certificate_expire_time = 13;

    // Output only. When the SIP password was last set, by create or by rotation.
    google.protobuf.Timestamp sip_password_set_at = 14;

    // Output only. The user who created the account.
    string created_by = 15;

    // Output only. Creation time of the account.
    google.protobuf.Timestamp created_at = 16;

    // Output only. The user who last modified the account, including credential rotation.
    string modified_by = 17;

    // Output only. Last modification time of the account, including credential rotation.
    google.protobuf.Timestamp modified_at = 18;
}

// A client certificate issued to a softphone account by the project&apos;s SOFTPHONE certificate
// authority. Carries public material only: the private key exists solely inside the PKCS#12 bundle that
// was returned once when the certificate was issued. Every field is output only.
message SoftphoneCertificate {

    // Resource name of the certificate.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;/certificates/&lt;certificate_uuid&gt;</code></pre>
    string name = 1;

    // Resource name of the softphone account the certificate was issued to.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;</code></pre>
    string softphone_account_name = 2;

    // Lifecycle status of the certificate. Independent of expiry: an expired certificate keeps its
    // status and is recognised by <code>not_after</code>.
    SoftphoneCertificateStatus status = 3;

    // The certificate, PEM encoded.
    string certificate_pem = 4;

    // The SOFTPHONE certificate authority certificate that issued it, PEM encoded. The project&apos;s
    // internal TLS port trusts this CA for client certificates.
    string issuer_ca_certificate_pem = 5;

    // SHA-256 fingerprint of the certificate: 32 upper-case hex bytes separated by colons, as displayed by
    // <code>openssl x509 -fingerprint -sha256</code>.
    string sha256_fingerprint = 6;

    // Serial number of the certificate, upper-case hex without separators.
    string serial_number = 7;

    // Subject distinguished name, RFC 4514 string form.
    string subject = 8;

    // Start of validity (notBefore).
    google.protobuf.Timestamp not_before = 9;

    // End of validity (notAfter).
    google.protobuf.Timestamp not_after = 10;

    // The user who caused the certificate to be issued (create or rotation).
    string created_by = 11;

    // When the certificate was issued.
    google.protobuf.Timestamp created_at = 12;

    // When the certificate became <code>SOFTPHONE_CERTIFICATE_STATUS_SUPERSEDED</code>. Unset otherwise.
    google.protobuf.Timestamp superseded_at = 13;

    // Resource name of the certificate that superseded this one. Empty unless SUPERSEDED.
    string superseded_by_certificate_name = 14;

    // When the certificate became <code>SOFTPHONE_CERTIFICATE_STATUS_REVOKED</code>. Unset otherwise.
    google.protobuf.Timestamp revoked_at = 15;

    // The user who revoked the certificate. Empty unless REVOKED.
    string revoked_by = 16;

    // The reason given at revocation, or <code>account deleted</code>. Empty unless REVOKED.
    string revocation_reason = 17;
}

// ONE-TIME secrets of a softphone account, returned only by <code>CreateSoftphoneAccount</code> and
// <code>RotateSoftphoneCredentials</code>. VTSI keeps no copy of the private key or of
// <code>pkcs12_password</code> and cannot return them again: store them now, or rotate later. Never log
// this message.
message SoftphoneCredentials {

    // The SIP digest password. Set on create and on every rotation (a certificate rotation rotates the
    // password too). At least 32 characters from a URL-safe alphabet.
    string sip_password = 1;

    // The client private key, the client certificate and the issuing SOFTPHONE CA certificate as a
    // password-protected PKCS#12 (<code>.p12</code>) bundle, ready to import into a softphone. Set when a
    // certificate was issued (create of a <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>
    // account, or a certificate rotation), empty otherwise.
    bytes pkcs12_bundle = 2;

    // The password protecting <code>pkcs12_bundle</code>. Set exactly when <code>pkcs12_bundle</code> is
    // set.
    string pkcs12_password = 3;

    // Public view of the certificate inside <code>pkcs12_bundle</code>. Unset when no certificate was
    // issued.
    SoftphoneCertificate certificate = 4;
}

// Everything needed to configure a softphone for one account, except the secrets. Every field is output
// only.
message SoftphoneProvisioning {

    // Resource name of the softphone account this describes.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;</code></pre>
    string softphone_account_name = 1;

    // The account&apos;s transport security, which decides <code>sip_server_port</code> and whether a
    // client certificate must be imported.
    SoftphoneTransportSecurity transport_security = 2;

    // The SIP domain of the account: the host part of its address of record. Zoiper: <i>Domain</i>.
    string sip_domain = 3;

    // The full address of record, <code>sip_username@sip_domain</code>.
    string sip_address = 4;

    // Host name or IP address of the project&apos;s Asterisk to connect to. It matches a subject
    // alternative name of the server certificate.
    string sip_server_host = 5;

    // TLS port to connect to: the internal mutual-TLS port for
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>, the external TLS port for
    // <code>SOFTPHONE_TRANSPORT_SECURITY_SERVER_TLS_ONLY</code>.
    int32 sip_server_port = 6;

    // Signalling transport. Always <code>TLS</code>.
    string sip_transport = 7;

    // Outbound proxy as <code>host:port</code>: <code>sip_server_host</code> and
    // <code>sip_server_port</code>. Zoiper: <i>Outbound proxy</i>.
    string outbound_proxy = 8;

    // The SIP user. Zoiper: <i>Username</i>.
    string username = 9;

    // The SIP digest authentication username. Zoiper: <i>Authentication user</i>.
    string auth_username = 10;

    // The SIP digest realm the Asterisk challenges with.
    string realm = 11;

    // Media encryption the softphone must use.
    SoftphoneSrtpMode srtp_mode = 12;

    // Audio codecs the Asterisk accepts for this account, in preference order, by their Asterisk
    // names: <code>opus</code>, <code>alaw</code> (G.711 A-law, Zoiper <i>PCMA</i>), <code>ulaw</code>
    // (G.711 mu-law, Zoiper <i>PCMU</i>).
    repeated string codecs = 13;

    // The certificate to trust for the Asterisk&apos;s TLS server, PEM encoded: its self-signed server
    // certificate, which is its own certificate authority. Import it as a trusted CA in the softphone, or
    // the TLS handshake fails verification. For a
    // <code>SOFTPHONE_TRANSPORT_SECURITY_SERVER_TLS_ONLY</code> account on a deployment that configured
    // its own certificate for the external TLS port, this is that certificate (chain) as configured.
    string server_ca_certificate_pem = 14;

    // SHA-256 fingerprint of the Asterisk&apos;s TLS server certificate (colon-separated upper-case hex),
    // for comparing with what the softphone displays on first connect.
    string server_certificate_sha256_fingerprint = 15;

    // Resource name of the client certificate to import. Empty for
    // <code>SOFTPHONE_TRANSPORT_SECURITY_SERVER_TLS_ONLY</code>.
    string client_certificate_name = 16;

    // SHA-256 fingerprint of the client certificate to import: the one inside the PKCS#12 bundle returned
    // when it was issued. Empty for <code>SOFTPHONE_TRANSPORT_SECURITY_SERVER_TLS_ONLY</code>. A softphone
    // holding a bundle with a different fingerprint holds a superseded or revoked certificate.
    string client_certificate_sha256_fingerprint = 17;

    // Expiry (notAfter) of the client certificate to import. Unset for
    // <code>SOFTPHONE_TRANSPORT_SECURITY_SERVER_TLS_ONLY</code>.
    google.protobuf.Timestamp client_certificate_expire_time = 18;

    // Human-readable, step-by-step Zoiper 5 configuration with the values of this message filled in:
    // Accounts &gt; Add account &gt; manual configuration &gt; SIP; then under Advanced the transport
    // <code>TLS</code>, the port, the outbound proxy and SRTP; then the certificates to trust and, for
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>, to import. Plain text, lines separated
    // by <code>\n</code>. Contains no secret: it refers to the SIP password and the PKCS#12 bundle by name.
    string zoiper_instructions = 19;

    // Note on client-certificate support, which depends on the Zoiper edition: an edition that cannot
    // present a client certificate cannot use <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>
    // and needs an account with <code>SOFTPHONE_TRANSPORT_SECURITY_SERVER_TLS_ONLY</code> instead.
    string client_certificate_support_note = 20;
}

//////////////////////////////////////////////////////////////////////////////
// Filters and sorting
//////////////////////////////////////////////////////////////////////////////

// Narrows a softphone account listing. Every field is optional; an unset field or an empty repeated
// field or map means &quot;do not filter on this&quot;. Fields are combined with AND; the values within
// one repeated field are combined with OR; the entries of <code>labels</code> are combined with AND.
message SoftphoneAccountFilter {

    // Only accounts with one of these transport securities.
    // <code>SOFTPHONE_TRANSPORT_SECURITY_UNSPECIFIED</code> is rejected with <code>INVALID_ARGUMENT</code>.
    repeated SoftphoneTransportSecurity transport_securities = 1;

    // Only enabled (<code>true</code>) or only disabled (<code>false</code>) accounts. Unset matches both.
    optional bool enabled = 2;

    // Only accounts carrying every one of these labels. An entry with an empty value matches on the
    // presence of the key alone; otherwise the value must match exactly.
    map<string, string> labels = 3;

    // Case-insensitive substring match against <code>display_name</code>. Empty does not filter. At most
    // 128 characters.
    string display_name_contains = 4;

    // Case-insensitive substring match against <code>sip_username</code>. Empty does not filter. At most
    // 64 characters.
    string sip_username_contains = 5;

    // Only accounts whose ACTIVE certificate expires strictly before this instant. Accounts without an
    // ACTIVE certificate never match. Combine with <code>certificate_expires_after</code> for a window.
    google.protobuf.Timestamp certificate_expires_before = 6;

    // Only accounts whose ACTIVE certificate expires at or after this instant. Accounts without an ACTIVE
    // certificate never match. A window whose start is not before its end is rejected with
    // <code>INVALID_ARGUMENT</code>.
    google.protobuf.Timestamp certificate_expires_after = 7;
}

// Narrows a softphone certificate listing. Combined like
// <a href="index.html#ondewo.vtsi.SoftphoneAccountFilter">SoftphoneAccountFilter</a>.
message SoftphoneCertificateFilter {

    // Only certificates with one of these statuses. Empty matches every status.
    // <code>SOFTPHONE_CERTIFICATE_STATUS_UNSPECIFIED</code> is rejected with <code>INVALID_ARGUMENT</code>.
    repeated SoftphoneCertificateStatus statuses = 1;

    // Only certificates whose <code>not_after</code> is strictly before this instant.
    google.protobuf.Timestamp expires_before = 2;

    // Only certificates whose <code>not_after</code> is at or after this instant. A window whose start is
    // not before its end is rejected with <code>INVALID_ARGUMENT</code>.
    google.protobuf.Timestamp expires_after = 3;
}

// Sorting of a softphone account listing.
message SoftphoneAccountSorting {

    // The field by which softphone accounts are sorted.
    enum SoftphoneAccountSortingField {

        // Default order: by <code>sip_username</code>, ascending.
        NO_SOFTPHONE_ACCOUNT_SORTING = 0;

        // Sort by <code>display_name</code>.
        SORT_SOFTPHONE_ACCOUNT_BY_DISPLAY_NAME = 1;

        // Sort by <code>sip_username</code>.
        SORT_SOFTPHONE_ACCOUNT_BY_SIP_USERNAME = 2;

        // Sort by <code>created_at</code>.
        SORT_SOFTPHONE_ACCOUNT_BY_CREATION_DATE = 3;

        // Sort by <code>modified_at</code>.
        SORT_SOFTPHONE_ACCOUNT_BY_LAST_MODIFIED = 4;

        // Sort by <code>current_certificate_expire_time</code>; accounts without an ACTIVE certificate
        // sort last in either mode.
        SORT_SOFTPHONE_ACCOUNT_BY_CERTIFICATE_EXPIRY = 5;
    }

    // The sorting field. Unset means <code>NO_SOFTPHONE_ACCOUNT_SORTING</code>.
    optional SoftphoneAccountSortingField sorting_field = 1;

    // The sorting mode. Unset means <code>ASCENDING</code>.
    optional VtsiProjectSortingMode sorting_mode = 2;
}

//////////////////////////////////////////////////////////////////////////////
// Requests and responses
//////////////////////////////////////////////////////////////////////////////

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.CreateSoftphoneAccount">Softphones.CreateSoftphoneAccount</a>.
message CreateSoftphoneAccountRequest {

    // VTSI project in which to create the account.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // The account to create. <code>sip_username</code> is required. Output-only fields must be left
    // unset and are otherwise rejected with <code>INVALID_ARGUMENT</code>.
    SoftphoneAccount softphone_account = 2;
}

// The response message for
// <a href="index.html#ondewo.vtsi.Softphones.CreateSoftphoneAccount">Softphones.CreateSoftphoneAccount</a>.
message CreateSoftphoneAccountResponse {

    // The created account.
    SoftphoneAccount softphone_account = 1;

    // ONE-TIME secrets: the SIP password and, for
    // <code>SOFTPHONE_TRANSPORT_SECURITY_CLIENT_CERTIFICATE</code>, the PKCS#12 bundle and its password.
    SoftphoneCredentials credentials = 2;
}

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.GetSoftphoneAccount">Softphones.GetSoftphoneAccount</a>.
message GetSoftphoneAccountRequest {

    // Resource name of the account.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;</code></pre>
    string name = 1;

    // Optional. Partial response: the <code>SoftphoneAccount</code> field paths to populate, e.g.
    // <code>display_name</code>, <code>enabled</code>. <code>name</code> is always populated. Unset or
    // empty returns every field. An unknown path is rejected with <code>INVALID_ARGUMENT</code>.
    google.protobuf.FieldMask field_mask = 2;
}

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.UpdateSoftphoneAccount">Softphones.UpdateSoftphoneAccount</a>.
message UpdateSoftphoneAccountRequest {

    // The account to update, identified by <code>softphone_account.name</code>, carrying the new values of
    // the fields named in <code>update_mask</code>.
    SoftphoneAccount softphone_account = 1;

    // Required. The fields to update. Paths are field paths within <code>softphone_account</code> WITHOUT a
    // <code>softphone_account.</code> prefix. Updatable paths:
    // <code>display_name</code>, <code>transport_security</code>, <code>enabled</code>,
    // <code>max_contacts</code>, <code>labels</code>, <code>allowed_destinations</code>.
    // Semantics:
    // <ul>
    //   <li>Mask unset or empty: rejected with <code>INVALID_ARGUMENT</code>. There is no implicit
    //       &quot;update everything sent&quot;.</li>
    //   <li>Path in the mask: the field is written with the value sent; a value that is not set is
    //       written as the field&apos;s create default (<code>enabled</code> unset writes
    //       <code>true</code>, <code>max_contacts</code> 0 writes the server default, an empty
    //       <code>labels</code> or <code>allowed_destinations</code> clears them).</li>
    //   <li>Path absent from the mask: the field is left untouched, whether or not a value was sent.</li>
    //   <li>Unknown, output-only or immutable path (<code>name</code>, <code>sip_username</code>, the
    //       certificate and audit fields): rejected with <code>INVALID_ARGUMENT</code> naming the path,
    //       never ignored.</li>
    // </ul>
    google.protobuf.FieldMask update_mask = 2;
}

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.DeleteSoftphoneAccount">Softphones.DeleteSoftphoneAccount</a>.
message DeleteSoftphoneAccountRequest {

    // Resource name of the account to delete.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;</code></pre>
    string name = 1;
}

// The response message for
// <a href="index.html#ondewo.vtsi.Softphones.DeleteSoftphoneAccount">Softphones.DeleteSoftphoneAccount</a>.
message DeleteSoftphoneAccountResponse {

    // Resource name of the deleted account.
    string name = 1;

    // How many certificates were revoked by the deletion (the ACTIVE one and any SUPERSEDED ones).
    int32 revoked_certificate_count = 2;
}

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.ListSoftphoneAccounts">Softphones.ListSoftphoneAccounts</a>.
message ListSoftphoneAccountsRequest {

    // VTSI project whose accounts to list.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 1;

    // Optional. Narrows the listing. Unset lists every account of the project.
    SoftphoneAccountFilter filter = 2;

    // Optional. Partial response, as in
    // <a href="index.html#ondewo.vtsi.GetSoftphoneAccountRequest">GetSoftphoneAccountRequest.field_mask</a>.
    google.protobuf.FieldMask field_mask = 3;

    // Optional. Maximum number of accounts per page. <code>0</code> means the server default of 20; values
    // above 1000 are clamped to 1000; negative values are rejected with <code>INVALID_ARGUMENT</code>.
    int32 page_size = 4;

    // Optional. The <code>next_page_token</code> of a previous response. Opaque; valid only with the same
    // <code>vtsi_project_name</code>, <code>filter</code> and <code>softphone_account_sorting</code>.
    optional string page_token = 5;

    // Optional. Sorting of the listing. Unset sorts by <code>sip_username</code>, ascending.
    SoftphoneAccountSorting softphone_account_sorting = 6;
}

// The response message for
// <a href="index.html#ondewo.vtsi.Softphones.ListSoftphoneAccounts">Softphones.ListSoftphoneAccounts</a>.
message ListSoftphoneAccountsResponse {

    // The accounts of this page.
    repeated SoftphoneAccount softphone_accounts = 1;

    // Token to retrieve the next page. Empty when there are no more results.
    string next_page_token = 2;
}

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.RotateSoftphoneCredentials">Softphones.RotateSoftphoneCredentials</a>.
// At least one of <code>rotate_sip_password</code> and <code>rotate_certificate</code> must be
// <code>true</code>.
message RotateSoftphoneCredentialsRequest {

    // Resource name of the account.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;</code></pre>
    string name = 1;

    // Generate a new SIP password. The old one stops working immediately.
    bool rotate_sip_password = 2;

    // Issue a new client certificate and key, and a new SIP password with them. The previous ACTIVE
    // certificate, if any, becomes <code>SOFTPHONE_CERTIFICATE_STATUS_SUPERSEDED</code>.
    bool rotate_certificate = 3;
}

// The response message for
// <a href="index.html#ondewo.vtsi.Softphones.RotateSoftphoneCredentials">Softphones.RotateSoftphoneCredentials</a>.
message RotateSoftphoneCredentialsResponse {

    // The account after the rotation.
    SoftphoneAccount softphone_account = 1;

    // ONE-TIME secrets: <code>sip_password</code> always, the PKCS#12 bundle, its password and the
    // certificate only when <code>rotate_certificate</code> was set.
    SoftphoneCredentials credentials = 2;
}

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.ListSoftphoneCertificates">Softphones.ListSoftphoneCertificates</a>.
message ListSoftphoneCertificatesRequest {

    // Required. Whose certificates to list.
    oneof scope {

        // Every certificate of every account of this VTSI project.
        // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
        string vtsi_project_name = 1;

        // The certificates of one softphone account.
        // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;</code></pre>
        string softphone_account_name = 2;
    }

    // Optional. Narrows the listing. Unset lists every certificate in scope.
    SoftphoneCertificateFilter filter = 3;

    // Optional. Partial response: the <code>SoftphoneCertificate</code> field paths to populate, e.g.
    // <code>status</code>, <code>not_after</code>. <code>name</code> is always populated. Unset or empty
    // returns every field. An unknown path is rejected with <code>INVALID_ARGUMENT</code>.
    google.protobuf.FieldMask field_mask = 4;

    // Optional. Maximum number of certificates per page, with the same default, cap and validation as
    // <a href="index.html#ondewo.vtsi.ListSoftphoneAccountsRequest">ListSoftphoneAccountsRequest.page_size</a>.
    int32 page_size = 5;

    // Optional. The <code>next_page_token</code> of a previous response. Opaque; valid only with the same
    // scope and filter.
    optional string page_token = 6;
}

// The response message for
// <a href="index.html#ondewo.vtsi.Softphones.ListSoftphoneCertificates">Softphones.ListSoftphoneCertificates</a>.
message ListSoftphoneCertificatesResponse {

    // The certificates of this page, newest <code>created_at</code> first.
    repeated SoftphoneCertificate softphone_certificates = 1;

    // Token to retrieve the next page. Empty when there are no more results.
    string next_page_token = 2;
}

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.GetSoftphoneCertificate">Softphones.GetSoftphoneCertificate</a>.
message GetSoftphoneCertificateRequest {

    // Resource name of the certificate.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;/certificates/&lt;certificate_uuid&gt;</code></pre>
    string name = 1;

    // Optional. Partial response, as in
    // <a href="index.html#ondewo.vtsi.ListSoftphoneCertificatesRequest">ListSoftphoneCertificatesRequest.field_mask</a>.
    google.protobuf.FieldMask field_mask = 2;
}

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.RevokeSoftphoneCertificate">Softphones.RevokeSoftphoneCertificate</a>.
message RevokeSoftphoneCertificateRequest {

    // Resource name of the certificate to revoke.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;/certificates/&lt;certificate_uuid&gt;</code></pre>
    string name = 1;

    // Optional. Why the certificate is revoked, e.g. <code>device lost</code>. At most 512 characters.
    // Stored as <code>revocation_reason</code>.
    string reason = 2;
}

// The request message for
// <a href="index.html#ondewo.vtsi.Softphones.GetSoftphoneProvisioning">Softphones.GetSoftphoneProvisioning</a>.
message GetSoftphoneProvisioningRequest {

    // Resource name of the account to provision.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/softphoneAccounts/&lt;softphone_account_uuid&gt;</code></pre>
    string name = 1;
}
