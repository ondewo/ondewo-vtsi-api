syntax = "proto3";

package ondewo.vtsi;
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "ondewo/sip/sip.proto";
// <code>ondewo.vtsi.CampaignStatistics</code> rides on campaign events.
import "ondewo/vtsi/campaigns.proto";

// <p>ONDEWO VTSI API</p>
// <p>Notifies other systems of VTSI events: calls, callers, listeners, scheduled callers,
// campaigns, VTSI projects, the project&apos;s Asterisk and softphone accounts. Every event is one
// value of <a href="index.html#ondewo.vtsi.VtsiEvent">VtsiEvent</a> and is delivered as a
// <a href="index.html#ondewo.vtsi.VtsiEventMessage">VtsiEventMessage</a>.</p>
// <p>Two delivery paths: the server-streaming <code>SubscribeVtsiEvents</code> RPC, and WEBHOOKS
// (an HTTP request per event to a URL of the client&apos;s choice). Which events go to which
// webhooks is configured per project with EVENT SUBSCRIPTIONS.</p>
// <p><b>Webhooks are best effort.</b> Each event is sent to a webhook as at most
// <code>ONDEWO_VTSI_WEBHOOK_MAX_ATTEMPTS</code> HTTP requests (3 by default) with backoff between
// them; after the last one fails, the event is dropped for that webhook. Pending webhook requests
// live in the memory of the server replica that produced the event and are lost when it restarts.
// An overloaded server, or a webhook that keeps timing out, drops events rather than slowing calls
// down. The same event can arrive more than once (a request whose answer was lost is sent again):
// de-duplicate by <code>event_id</code>. Requests of one webhook can arrive out of order, because
// several server replicas send independently: order by <code>resource_sequence</code> per
// <code>resource_name</code>, then <code>event_time</code>. Events a webhook missed can be sent again from
// the journal with <code>RedeliverWebhookEvents</code>.</p>
// <p><b>Webhook requests.</b> One HTTP request per event, with the webhook&apos;s <code>http_method</code>
// (POST by default), the <code>VtsiEventMessage</code> as the body (proto3 JSON, original field names,
// UTF-8) and these headers, set by the server (a custom header can never use these names):</p>
// <ul>
//   <li><code>Content-Type: application/json</code></li>
//   <li><code>User-Agent: ondewo-vtsi/&lt;server version&gt;</code></li>
//   <li><code>X-Ondewo-Vtsi-Event</code>: the <code>VtsiEvent</code> name, e.g.
//       <code>VTSI_EVENT_CALL_CONNECTED</code> (the decimal number for a value the server cannot name)</li>
//   <li><code>X-Ondewo-Vtsi-Event-Id</code>: the <code>event_id</code></li>
//   <li><code>X-Ondewo-Vtsi-Delivery-Attempt</code>: the request&apos;s attempt number for this event, starting
//       at 1 (a redelivery starts at 1 again)</li>
//   <li><code>X-Ondewo-Vtsi-Webhook</code>: the webhook&apos;s resource name, so one endpoint can serve
//       several webhooks</li>
//   <li><code>X-Ondewo-Vtsi-Signature</code>: only when the webhook has a <code>signing_secret</code>:
//       <code>t=&lt;unix seconds&gt;,v1=&lt;signature&gt;</code>, see <code>Webhook.signing_secret</code></li>
//   <li><code>X-Ondewo-Vtsi-Redelivery: true</code>: only on requests sent by
//       <code>RedeliverWebhookEvents</code></li>
//   <li><code>X-Ondewo-Vtsi-Test: true</code>: only on requests sent by <code>TestWebhook</code></li>
// </ul>
// <p>then the webhook&apos;s <code>custom_headers</code>. A 2xx answer is a delivery; a 408, 425, 429 or 5xx
// answer, a timeout or a connection failure is retried; any other answer (a 3xx included: redirects are
// never followed) fails the event for that webhook at once.</p>
// <p><b>Streams can be resumed.</b> While a project has an open <code>SubscribeVtsiEvents</code>
// stream (and for <code>ONDEWO_VTSI_EVENT_STREAM_RESUME_WINDOW_S</code>, 1 h by default, after the last one
// closed) or an enabled event subscription, its events are also written to a short-lived journal
// (<code>ONDEWO_VTSI_EVENT_JOURNAL_RETENTION_S</code>, 24 h by default). A stream that reconnects with its last
// <code>resume_token</code>, or opens with a <code>start_time</code>, receives the events it missed, provided
// they are still in the journal; <code>RedeliverWebhookEvents</code> reads the same journal. Nothing else is
// persisted for redelivery, and events of a period in which the project had neither a stream nor an enabled
// subscription were never journaled.</p>
// <p>Use the status RPCs (<code>GetCampaign</code>, <code>ListCalls</code>, the status streams) to
// reconcile.</p>
// <p><b>Custom header values and signing secrets are write-only.</b> They are returned as
// <code>********</code> by every RPC and are never logged or put on an event.</p>
// <p><b>Names.</b> Event subscriptions are named
// <code>projects/&lt;project_uuid&gt;/event_subscriptions/&lt;subscription_uuid&gt;</code>, webhooks
// <code>projects/&lt;project_uuid&gt;/webhooks/&lt;webhook_uuid&gt;</code>, projects
// <code>projects/&lt;project_uuid&gt;/project</code>. Display names of webhooks and subscriptions are free
// text of at most 128 characters, NOT unique (two webhooks may share one) and may be empty; an empty display
// name stays empty (no default is generated). Resources are always addressed by resource name.</p>
// <p><b>Partial responses.</b> Every RPC returning a <code>VtsiEventSubscription</code> or a
// <code>Webhook</code>, the listings and the two <code>Delete*</code> RPCs (paths of their response) accept a
// <code>field_mask</code> with the convention of
// <a href="index.html#ondewo.vtsi.GetCampaignRequest">GetCampaignRequest.field_mask</a>: paths relative to the
// returned message, <code>name</code> always populated, unset or empty returns every field, an unknown path or
// a path below a repeated or map field is <code>INVALID_ARGUMENT</code> naming it, applied after the masking
// of secrets so a masked value stays <code>********</code>. A mask never changes what the RPC does.</p>
// <p><b>Authorization</b> (when enforced): the subscription and webhook RPCs, <code>TestWebhook</code> and
// <code>RedeliverWebhookEvents</code> need <code>PROJECT_DEVELOPER</code> or a higher role
// (<code>PROJECT_ADMIN</code>) on the project, or <code>SERVER_ADMIN</code>: a webhook is a standing outbound
// integration, i.e. administration. <code>SubscribeVtsiEvents</code> reads the project&apos;s events and needs
// <code>PROJECT_EXECUTOR</code> or higher.</p>
// <p>Errors are gRPC status codes: <code>INVALID_ARGUMENT</code> for a malformed resource name (also one of
// another collection), a request field out of range, a resource of another project than the request&apos;s
// <code>vtsi_project_name</code>, an output-only field that was set, an unknown <code>update_mask</code> or
// <code>field_mask</code> path; <code>NOT_FOUND</code> for an unknown project, subscription or webhook;
// <code>PERMISSION_DENIED</code> with authorization enforced for a project on which the caller holds no
// sufficient role (an unknown project included, so it is not answered <code>NOT_FOUND</code>);
// <code>UNAUTHENTICATED</code> for a request without a valid credential while authorization is enforced;
// <code>FAILED_PRECONDITION</code> for a disabled subscription or webhook where the RPC needs an enabled one;
// <code>ABORTED</code> when a concurrent change of the same subscription or webhook won (nothing was written;
// retry); <code>OUT_OF_RANGE</code> for a <code>start_time</code> older than the journal&apos;s retention;
// <code>RESOURCE_EXHAUSTED</code> when the server has no free stream slot
// (<code>ONDEWO_VTSI_EVENT_STREAM_MAX_CONCURRENT</code>, 16 per replica by default);
// <code>UNAVAILABLE</code> when event streams are not available on the replica reached (retry).</p>
service Events {

    //////////////////////////////////////////////////////////////////////////////
    // Event subscription endpoints
    //////////////////////////////////////////////////////////////////////////////

    // <p>Creates an event subscription: which events of the project are delivered to which
    // webhooks. A subscription without webhooks is usable by <code>SubscribeVtsiEvents</code>. Takes effect
    // within a few seconds on every server replica. Not idempotent: a repeat creates a second subscription.
    // Emits <code>VTSI_EVENT_EVENT_SUBSCRIPTION_CREATED</code>.</p>
    // <p>Errors: <code>NOT_FOUND</code> for an unknown project or webhook; <code>INVALID_ARGUMENT</code>
    // for a malformed <code>vtsi_project_name</code>, no events and <code>all_events</code> unset,
    // <code>events</code> together with <code>all_events</code>, <code>VTSI_EVENT_UNSPECIFIED</code> or a
    // reserved value in <code>events</code> or <code>excluded_events</code>, an event both in
    // <code>events</code> and <code>excluded_events</code>, a webhook or a campaign name of another project, a
    // malformed webhook or campaign name, more entries than a list allows, a <code>display_name</code> over 128
    // characters, an output-only field that was set or an unknown <code>field_mask</code> path. A campaign
    // named in <code>campaign_names</code> need not exist (it may be created later or deleted since).</p>
    rpc CreateVtsiEventSubscription (CreateVtsiEventSubscriptionRequest) returns (VtsiEventSubscription);

    // <p>Returns an event subscription. Read-only.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for an empty or malformed <code>name</code> or an unknown
    // <code>field_mask</code> path; <code>NOT_FOUND</code> for an unknown project or subscription.</p>
    rpc GetVtsiEventSubscription (GetVtsiEventSubscriptionRequest) returns (VtsiEventSubscription);

    // <p>Updates the fields named in <code>update_mask</code>: <code>display_name</code>,
    // <code>events</code>, <code>all_events</code>, <code>excluded_events</code>,
    // <code>resource_name_prefixes</code>, <code>campaign_names</code>, <code>webhook_names</code>,
    // <code>disabled</code>. Takes effect within a few seconds on every server replica; disabling it ends
    // the open <code>SubscribeVtsiEvents</code> streams that name it (<code>STREAM_END_REASON_SUBSCRIPTION_DISABLED</code>).
    // The result is validated as a whole, as on create. Emits
    // <code>VTSI_EVENT_EVENT_SUBSCRIPTION_UPDATED</code> (attribute <code>updated_fields</code>).</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for a malformed <code>event_subscription.name</code>, an empty
    // mask, an unknown or output-only path, a result that would be invalid on create, or an unknown
    // <code>field_mask</code> path; <code>NOT_FOUND</code> for an unknown project, subscription or webhook;
    // <code>ABORTED</code> when a concurrent update won.</p>
    rpc UpdateVtsiEventSubscription (UpdateVtsiEventSubscriptionRequest) returns (VtsiEventSubscription);

    // <p>Deletes an event subscription. Open <code>SubscribeVtsiEvents</code> streams that name it
    // end with <code>end_reason</code> set (<code>STREAM_END_REASON_SUBSCRIPTION_DELETED</code>). Its webhooks
    // are not deleted. Emits <code>VTSI_EVENT_EVENT_SUBSCRIPTION_DELETED</code>.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for an empty or malformed <code>name</code> or an unknown
    // <code>field_mask</code> path; <code>NOT_FOUND</code> for an unknown project or subscription (also on a
    // repeated delete).</p>
    rpc DeleteVtsiEventSubscription (DeleteVtsiEventSubscriptionRequest) returns (DeleteVtsiEventSubscriptionResponse);

    // <p>Lists the event subscriptions of a project, newest first, paged.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for a malformed <code>vtsi_project_name</code>, a negative
    // <code>page_size</code>, a foreign <code>page_token</code> or an unknown <code>field_mask</code> path;
    // <code>NOT_FOUND</code> for an unknown project.</p>
    rpc ListVtsiEventSubscriptions (ListVtsiEventSubscriptionsRequest) returns (ListVtsiEventSubscriptionsResponse);

    //////////////////////////////////////////////////////////////////////////////
    // Webhook endpoints
    //////////////////////////////////////////////////////////////////////////////

    // <p>Creates a webhook: an HTTP(S) endpoint that receives one request per event, with a JSON
    // body holding the <code>VtsiEventMessage</code> (proto3 JSON, original field names; see the service
    // documentation for the headers). A webhook receives events only once an event subscription names it.
    // Not idempotent. Emits <code>VTSI_EVENT_WEBHOOK_CREATED</code>.</p>
    // <p>Errors: <code>NOT_FOUND</code> for an unknown project; <code>INVALID_ARGUMENT</code> for a
    // malformed <code>vtsi_project_name</code>, a URL that is not http(s), has no host, carries user
    // information (use a custom header for credentials) or exceeds 2048 characters; for a reserved or
    // malformed header name, a header value with a line break, too many or too long headers; for a timeout
    // outside 1 s to 30 s; for a <code>signing_secret</code> that is not 32 to 256 printable ASCII characters
    // without whitespace (or is the mask <code>********</code>); for a <code>display_name</code> over 128
    // characters, an output-only field that was set or an unknown <code>field_mask</code> path.</p>
    rpc CreateWebhook (CreateWebhookRequest) returns (Webhook);

    // <p>Returns a webhook. Custom header values and the signing secret are masked. Read-only.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for an empty or malformed <code>name</code> or an unknown
    // <code>field_mask</code> path; <code>NOT_FOUND</code> for an unknown project or webhook.</p>
    rpc GetWebhook (GetWebhookRequest) returns (Webhook);

    // <p>Updates the fields named in <code>update_mask</code>: <code>display_name</code>,
    // <code>url</code>, <code>http_method</code>, <code>custom_headers</code>, <code>disabled</code>,
    // <code>timeout</code>, <code>signing_secret</code>. <code>custom_headers</code> replaces the whole map; a
    // value equal to the mask <code>********</code> keeps the stored value of that header, so a
    // Get-modify-Update round trip does not overwrite secrets with the mask. <code>signing_secret</code>
    // follows the same rule (see <code>Webhook.signing_secret</code> for rotation).</p>
    // <p>Moving the webhook to another origin (scheme, host or port of <code>url</code>) while custom
    // headers are stored requires re-sending <code>custom_headers</code> in the same request, with
    // their REAL values (or an empty map to drop them): the stored values are never carried to a new
    // origin, and an update that leaves <code>custom_headers</code> out of the mask or sends the mask
    // value <code>********</code> for any header is rejected with <code>INVALID_ARGUMENT</code> naming
    // the headers. A new path on the same origin keeps the stored values. The signing secret is kept on a
    // new origin (it is never sent, only used to sign). Takes effect within a few seconds on every replica.
    // Emits <code>VTSI_EVENT_WEBHOOK_UPDATED</code> (attribute
    // <code>updated_fields</code>).</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for a malformed <code>webhook.name</code>, an empty mask, an
    // unknown or output-only path, a value invalid on create, the origin rule above, or an unknown
    // <code>field_mask</code> path; <code>NOT_FOUND</code> for an unknown project or webhook;
    // <code>ABORTED</code> when a concurrent update won.</p>
    rpc UpdateWebhook (UpdateWebhookRequest) returns (Webhook);

    // <p>Deletes a webhook and removes it from every event subscription; requests of it still queued are
    // dropped. Emits <code>VTSI_EVENT_WEBHOOK_DELETED</code>.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for an empty or malformed <code>name</code> or an unknown
    // <code>field_mask</code> path; <code>NOT_FOUND</code> for an unknown project or webhook (also on a
    // repeated delete).</p>
    rpc DeleteWebhook (DeleteWebhookRequest) returns (DeleteWebhookResponse);

    // <p>Lists the webhooks of a project, newest first, paged. Custom header values and signing secrets are
    // masked.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for a malformed <code>vtsi_project_name</code>, a negative
    // <code>page_size</code>, a foreign <code>page_token</code> or an unknown <code>field_mask</code> path;
    // <code>NOT_FOUND</code> for an unknown project.</p>
    rpc ListWebhooks (ListWebhooksRequest) returns (ListWebhooksResponse);

    // <p>Sends one test event to a webhook now, without retries, and reports the outcome: a
    // <code>VTSI_EVENT_WEBHOOK_TEST</code> event, or, with <code>sample_event</code>, an event shaped like that
    // real event (see <code>TestWebhookRequest.sample_event</code>). The request carries every header of a real
    // delivery (signature included) plus <code>X-Ondewo-Vtsi-Test: true</code>. Works on a disabled webhook
    // too, and ignores an open circuit. The test event is not journaled, not counted in
    // <code>delivery_statistics</code> and not delivered anywhere else.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for an empty or malformed <code>name</code>, or a
    // <code>sample_event</code> that is reserved or unknown to the server; <code>NOT_FOUND</code> for an
    // unknown project or webhook. A failed delivery is reported in the response, not as an error status.</p>
    rpc TestWebhook (TestWebhookRequest) returns (TestWebhookResponse);

    // <p>Sends events from the server&apos;s event journal to a webhook again: the events named by
    // <code>event_ids</code>, or the events of a time window that the webhook&apos;s event subscriptions select
    // (optionally narrowed by <code>filter</code>). Each event is queued for the webhook like a new delivery
    // (same body and <code>event_id</code>, so a receiver de-duplicates as usual, attempt numbers from 1,
    // retries and backoff as configured, header <code>X-Ondewo-Vtsi-Redelivery: true</code>) on the replica
    // that serves the request, oldest first. Best effort like every webhook delivery: the RPC answers once the
    // events are queued, not delivered; follow <code>delivery_statistics</code> or the receiver.</p>
    // <p>Only what the journal still holds can be sent: events older than
    // <code>ONDEWO_VTSI_EVENT_JOURNAL_RETENTION_S</code> (24 h by default) and events of a period in which the
    // project had neither an open stream nor an enabled event subscription are not available and are counted
    // in <code>not_in_journal_count</code> when named. At most 1000 events are queued per request
    // (<code>not_enqueued_count</code> and <code>next_start_time</code> say how to continue). Not idempotent: a
    // repeat sends the events again. Emits no event.</p>
    // <p>Errors: <code>INVALID_ARGUMENT</code> for an empty or malformed <code>webhook_name</code>, neither or
    // both of <code>event_ids</code> and <code>start_time</code>, more than 1000 <code>event_ids</code>, an
    // <code>event_id</code> that is not a uuid, <code>end_time</code> without <code>start_time</code> or not
    // after it, a window longer than the journal retention, or an invalid <code>filter</code> (as on
    // <code>SubscribeVtsiEvents</code>); <code>NOT_FOUND</code> for an unknown project or webhook;
    // <code>FAILED_PRECONDITION</code> for a disabled webhook (enable it first; <code>TestWebhook</code> works
    // on a disabled one); <code>OUT_OF_RANGE</code> for a <code>start_time</code> older than the journal
    // retention; <code>RESOURCE_EXHAUSTED</code> when the server&apos;s webhook queue cannot take a single
    // event now (retry later).</p>
    rpc RedeliverWebhookEvents (RedeliverWebhookEventsRequest) returns (RedeliverWebhookEventsResponse);

    //////////////////////////////////////////////////////////////////////////////
    // Event stream endpoint
    //////////////////////////////////////////////////////////////////////////////

    // <p>Streams the events of a project as they happen, selected either by a named event
    // subscription or by an inline filter. An empty message is sent as a keep-alive after
    // <code>ONDEWO_VTSI_EVENT_STREAM_KEEPALIVE_S</code> (15 s by default) without an event. After a
    // disconnect, pass the last <code>resume_token</code> to continue where the stream stopped, or open
    // with a <code>start_time</code> to replay from a point in time;
    // events older than the server&apos;s retention (24 h by default) are no longer available, and
    // the journal records a project&apos;s events only while it has an open stream (and for 1 h
    // after the last one closed) or an enabled event subscription. A stream sees events of other
    // server replicas from at most a few seconds after it opened. A client that stops reading for
    // longer than the server&apos;s stall timeout (<code>ONDEWO_VTSI_STREAM_STALL_TIMEOUT_S</code>, 30 s by
    // default) is disconnected; one that reads so slowly that the stream&apos;s buffer
    // (<code>ONDEWO_VTSI_EVENT_STREAM_BUFFER_SIZE</code>, 1000 events) overflows gets a last message with
    // <code>STREAM_END_REASON_CLIENT_TOO_SLOW</code>; reconnect with the <code>resume_token</code> in both
    // cases.</p>
    // <p>The server ends the stream with a last message carrying <code>end_reason</code>,
    // <code>end_reason_type</code> and a final <code>resume_token</code>: at the maximum stream duration
    // <code>ONDEWO_VTSI_EVENT_STREAM_MAX_DURATION_S</code> (3600 s by default), on server shutdown, when the
    // client is too slow, when the named subscription is deleted or disabled, and when the project is deleted
    // (after delivering <code>VTSI_EVENT_VTSI_PROJECT_DELETED</code>). While authorization is enforced, the
    // caller&apos;s role is re-checked periodically; a revoked role ends the RPC with
    // <code>PERMISSION_DENIED</code>, an expired credential with <code>UNAUTHENTICATED</code>.</p>
    // <p>Errors: <code>NOT_FOUND</code> for an unknown project or subscription;
    // <code>INVALID_ARGUMENT</code> for a malformed <code>vtsi_project_name</code>, a malformed or foreign
    // <code>event_subscription_name</code> (of another project), a malformed <code>resume_token</code> or
    // one issued for another project, <code>resume_token</code> together with <code>start_time</code>, a
    // <code>start_time</code> in the future, or an invalid <code>filter</code> (a reserved or unspecified
    // event, an event both selected and excluded, <code>all_events</code> with <code>events</code>, a malformed
    // campaign name or one of another project, more than 50 prefixes or campaign names);
    // <code>OUT_OF_RANGE</code> for a <code>start_time</code> older than the journal retention;
    // <code>FAILED_PRECONDITION</code> for a disabled subscription; <code>RESOURCE_EXHAUSTED</code>
    // when the server has no free stream slot; <code>UNAVAILABLE</code> when the replica reached serves no
    // event streams (retry).</p>
    rpc SubscribeVtsiEvents (SubscribeVtsiEventsRequest) returns (stream SubscribeVtsiEventsResponse);
}

//////////////////////////////////////////////////////////////////////////////
// Enums
//////////////////////////////////////////////////////////////////////////////

// Every event VTSI reports. Values are grouped by resource in blocks of 100; numbers are stable.
// <p><b>Attributes.</b> <code>VtsiEventMessage.attributes</code> carries the event-specific values listed at
// each value below; a key whose value is unknown is left out, and keys not listed are never sent. Formats:
// counts and numbers are base-10 integers without separators (<code>3</code>); booleans are
// <code>true</code> / <code>false</code>; times are RFC 3339 in UTC with a numeric offset
// (<code>2026-10-11T12:00:00+00:00</code>, fractional seconds possible); resource names are complete
// (<code>projects/&lt;project_uuid&gt;/callers/&lt;caller_uuid&gt;</code>); <code>updated_fields</code> is a
// comma-separated list of <code>update_mask</code> paths without spaces (<code>display_name,url</code>);
// a campaign <code>state</code> / <code>previous_state</code> is the <code>CampaignState</code> name WITHOUT
// its <code>CAMPAIGN_STATE_</code> prefix (<code>RUNNING</code>). An event carries at most 20 attributes and
// a value at most 256 characters (longer values are cut); <code>description</code> and
// <code>sip_status_description</code> at most 1024 characters.</p>
// <p><b>Call status attributes</b>, on every event derived from a change of a call&apos;s SIP status (marked
// "call status attributes" below): <code>caller_name</code>, <code>listener_name</code> or
// <code>scheduled_caller_name</code> (the resource that owns the call, the one that applies) and
// <code>phone_number</code> (the callee or caller number in clear, where recorded; treat it as personal
// data). Such an event also sets <code>call_name</code>, <code>sip_status_type</code>,
// <code>previous_sip_status_type</code> (unset for a new call record), <code>sip_status_description</code>
// and <code>resource_sequence</code> (the call&apos;s status change number), and has a deterministic
// <code>event_id</code>, so replicas observing the same change report one event.</p>
// <p><b>Campaign call attributes</b>, on the <code>VTSI_EVENT_CAMPAIGN_CALL_*</code> events:
// <code>attempt_number</code> (attempts started so far), <code>phone_number</code> (the callee in clear) and
// <code>caller_name</code> (caller of the current or last attempt). They also set <code>call_name</code>,
// <code>campaign_name</code>, <code>sip_status_type</code>, <code>sip_status_description</code> and
// <code>resource_sequence</code>; never <code>campaign_statistics</code>.</p>
enum VtsiEvent {

    // Unspecified. Never emitted; refused in a subscription.
    VTSI_EVENT_UNSPECIFIED = 0;

    // ---- Calls (resource_name: the call) ----

    // A call record was created: an outbound call was placed, or a listener received a call. Call status
    // attributes.
    VTSI_EVENT_CALL_CREATED = 100;

    // The call is ringing: <code>INCOMING_CALL_INITIATED</code> / <code>OUTGOING_CALL_INITIATED</code>. Call
    // status attributes.
    VTSI_EVENT_CALL_INITIATED = 101;

    // The call was answered: <code>INCOMING_CALL_CONNECTED</code> / <code>OUTGOING_CALL_CONNECTED</code>. Call
    // status attributes.
    VTSI_EVENT_CALL_CONNECTED = 102;

    // The call ended normally: <code>INCOMING_CALL_FINISHED</code> / <code>OUTGOING_CALL_FINISHED</code>. Call
    // status attributes.
    VTSI_EVENT_CALL_FINISHED = 103;

    // The call failed: <code>INCOMING_CALL_FAILED</code> / <code>OUTGOING_CALL_FAILED</code>. Call status
    // attributes.
    VTSI_EVENT_CALL_FAILED = 104;

    // A transfer of the call started: <code>TRANSFER_CALL_INITIATED</code>. Emitted when a BLIND transfer was
    // accepted, or when the target of a WARM transfer starts ringing.
    // <p>Attributes: <code>transfer_id</code> (the target, a phone number masked to its last 3 digits, e.g.
    // <code>***678</code>, or an extension), <code>target_type</code> (<code>phone_number</code>,
    // <code>softphone</code>, <code>listener</code>, <code>listener_queue</code>, <code>legacy</code>,
    // <code>unknown</code>), <code>mode</code> (<code>blind</code> / <code>warm</code>; <code>WARM</code>, upper
    // case, when reported for the ringing WARM leg), <code>outcome</code> (<code>accepted</code>,
    // <code>pending</code>, ...), <code>sip_response_code</code> (SIP code, <code>0</code> when unknown),
    // <code>error_reason</code> (kebab-case token, may be empty), <code>participant_id</code> (WARM leg),
    // <code>source</code> (<code>call_monitor</code> when observed by the call monitor). Sets
    // <code>call_name</code>.</p>
    VTSI_EVENT_CALL_TRANSFER_INITIATED = 105;

    // <code>TransferCall</code> transferred the call. Emitted at the call&apos;s terminal edge: a
    // <code>*_CALL_FINISHED</code> status whose description is <code>Call transferred</code>.
    // <p>Attributes: <code>transfer_id</code> (masked as above), <code>mode</code> (<code>blind</code> /
    // <code>warm</code>), <code>outcome</code> (<code>accepted</code>), <code>sip_response_code</code>,
    // <code>source</code> (<code>call_monitor</code>), and the call status attributes
    // (<code>caller_name</code> / <code>listener_name</code> / <code>scheduled_caller_name</code>,
    // <code>phone_number</code>). Sets the call status fields.</p>
    VTSI_EVENT_CALL_TRANSFERRED = 106;

    // A transfer failed and the call was KEPT with the bot: <code>TRANSFER_CALL_FAILED</code>, a refused or unanswered
    // REFER, or a WARM target that was busy or did not answer.
    // <p>Attributes: as <code>VTSI_EVENT_CALL_TRANSFER_INITIATED</code>, with <code>outcome</code> naming the
    // failure (<code>target_invalid</code>, <code>refer_rejected</code>, <code>timeout</code>,
    // <code>call_ended</code>, <code>call_scope_mismatch</code>, <code>sip_unreachable</code>,
    // <code>refused</code>, or the SIP reason in snake case), <code>error_reason</code> and, for a WARM leg,
    // <code>participant_id</code> and <code>end_reason</code> (as on
    // <code>VTSI_EVENT_CALL_PARTICIPANT_FAILED</code>). <code>description</code> says why.</p>
    VTSI_EVENT_CALL_TRANSFER_FAILED = 107;

    // A hang-up started: <code>SOFT_HANGUP_INITIATED</code> / <code>HARD_HANGUP_INITIATED</code>. Call status
    // attributes.
    VTSI_EVENT_CALL_HANGUP_INITIATED = 108;

    // An answering machine was detected: <code>OUTGOING_CALL_ANSWERING_MACHINE_DETECTED</code>. Call status
    // attributes.
    VTSI_EVENT_CALL_ANSWERING_MACHINE_DETECTED = 109;

    // The call was ended by <code>StopCall</code>, <code>StopCalls</code>, <code>StopAllCalls</code>
    // or a campaign hard stop. No attributes; <code>call_name</code> is not set (the call is the
    // <code>resource_name</code>).
    VTSI_EVENT_CALL_STOPPED = 110;

    // The SIP status of the call changed (emitted for EVERY change, in addition to the specific
    // events above). <code>previous_sip_status_type</code> holds the status before. Call status
    // attributes.
    VTSI_EVENT_CALL_SIP_STATUS_CHANGED = 111;

    // A participant was invited into the call (<code>InviteToCall</code>).
    // <p>Attributes (the participant attributes, also on 113 to 115): <code>participant_id</code>,
    // <code>mode</code> (<code>CONFERENCE</code> / <code>MONITOR</code>), <code>purpose</code>
    // (<code>invite</code> / <code>warm_transfer</code>), <code>state</code> (<code>ParticipantState</code> name,
    // e.g. <code>PARTICIPANT_STATE_RINGING</code>), <code>softphone_account_name</code> (when a softphone
    // account was invited), <code>end_reason</code> (on 114 and 115: <code>NOANSWER</code>, <code>BUSY</code>,
    // <code>CHANUNAVAIL</code>, <code>CALL_ENDED</code>, <code>REMOVED</code>, <code>HANGUP</code>,
    // <code>HANDED_OVER</code>, <code>JOIN_FAILED</code>, <code>TIMEOUT</code>), <code>actor</code> (who caused
    // it: the authenticated user, or <code>system:call-control</code>), <code>source</code>. Sets
    // <code>call_name</code> and <code>description</code>.</p>
    VTSI_EVENT_CALL_PARTICIPANT_INVITED = 112;

    // An invited participant answered and joined the call. The participant attributes (see 112);
    // <code>actor</code> is who invited it.
    VTSI_EVENT_CALL_PARTICIPANT_JOINED = 113;

    // An invited participant never joined (busy, no answer, unavailable, the call ended, ...). The
    // participant attributes (see 112), with <code>end_reason</code>.
    VTSI_EVENT_CALL_PARTICIPANT_FAILED = 114;

    // A joined participant left the call. The participant attributes (see 112), with
    // <code>end_reason</code>.
    VTSI_EVENT_CALL_PARTICIPANT_LEFT = 115;

    // The bot of the call was muted. Attributes: <code>source</code> (<code>operator</code> for
    // <code>SetCallMediaControl</code>, <code>call_monitor</code> when the server observed it) and
    // <code>actor</code> (the authenticated user where a person caused it, <code>system</code> for the call
    // monitor). Sets <code>call_name</code>.
    VTSI_EVENT_CALL_BOT_MUTED = 116;

    // The bot of the call was unmuted. Attributes as <code>VTSI_EVENT_CALL_BOT_MUTED</code>.
    VTSI_EVENT_CALL_BOT_UNMUTED = 117;

    // The bot of the call stopped listening to the caller. Attributes as
    // <code>VTSI_EVENT_CALL_BOT_MUTED</code>.
    VTSI_EVENT_CALL_LISTENING_PAUSED = 118;

    // The bot of the call listens to the caller again. Attributes as
    // <code>VTSI_EVENT_CALL_BOT_MUTED</code>.
    VTSI_EVENT_CALL_LISTENING_RESUMED = 119;

    // A live call audio stream (<code>StreamCallAudio</code> / <code>ListenCallAudio</code>) connected.
    // Attributes: <code>stream_id</code> (uuid), <code>mode</code> (<code>LISTEN</code> / <code>TALK</code>),
    // <code>rpc</code> (<code>ListenCallAudio</code> / <code>StreamCallAudio</code>), <code>actor</code> (the
    // authenticated user, when known). Sets <code>call_name</code>.
    VTSI_EVENT_CALL_AUDIO_STREAM_CONNECTED = 120;

    // A live call audio stream disconnected. Attributes as
    // <code>VTSI_EVENT_CALL_AUDIO_STREAM_CONNECTED</code>, plus <code>end_reason</code> (the
    // <code>CallAudioEndReason</code> name without prefix: <code>CLIENT_CLOSED</code>, <code>CALL_ENDED</code>,
    // <code>CALL_TRANSFERRED</code>, <code>MAX_DURATION</code>, <code>STALLED</code>, <code>INTERNAL</code>,
    // <code>UNSPECIFIED</code>).
    VTSI_EVENT_CALL_AUDIO_STREAM_DISCONNECTED = 121;

    // The stored record of the call was updated (<code>UpdateCall</code>, <code>UpdateCalls</code>); the call
    // itself is unchanged. Attribute <code>updated_fields</code> (the <code>update_mask</code> paths, e.g.
    // <code>labels</code>). Never carries a label value. Sets <code>call_name</code>. Not emitted for an entry
    // of a batch that failed, nor when the update changed nothing.
    VTSI_EVENT_CALL_UPDATED = 122;

    // ---- Callers (resource_name: the caller) ----

    // A caller started and placed its call. No attributes; sets <code>call_name</code>.
    VTSI_EVENT_CALLER_STARTED = 200;

    // A caller could not be started; <code>description</code> says why. No attributes.
    VTSI_EVENT_CALLER_START_FAILED = 201;

    // A caller was stopped (<code>StopCaller</code>, <code>StopCallers</code>). No attributes.
    VTSI_EVENT_CALLER_STOPPED = 202;

    // A caller was deleted. No attributes.
    VTSI_EVENT_CALLER_DELETED = 203;

    // A caller&apos;s container was restarted by the server. Attributes: <code>container_name</code>,
    // <code>reason</code> (free text, at most 64 characters, e.g. <code>end-call-marker-expired</code>).
    VTSI_EVENT_CALLER_RESTARTED = 204;

    // A caller&apos;s container was found not running or unhealthy. Attribute <code>container_name</code>;
    // <code>description</code> is <code>container not running</code> or <code>container unhealthy</code>; sets
    // <code>call_name</code>.
    VTSI_EVENT_CALLER_UNHEALTHY = 205;

    // A caller reported unhealthy is healthy again (its container answers its health check, or its
    // restart succeeded). Best effort: reported by the replica that reported it unhealthy. No
    // attributes; sets <code>call_name</code> where known.
    VTSI_EVENT_CALLER_HEALTHY = 206;

    // The stored configuration of a caller was updated (<code>UpdateCaller</code>, <code>UpdateCallers</code>);
    // its running container is unchanged. Attribute <code>updated_fields</code> (the <code>update_mask</code>
    // paths). Never carries a configuration value.
    VTSI_EVENT_CALLER_UPDATED = 207;

    // ---- Listeners (resource_name: the listener) ----

    // A listener started and is waiting for calls. No attributes; sets <code>call_name</code>.
    VTSI_EVENT_LISTENER_STARTED = 300;

    // A listener could not be started; <code>description</code> says why. No attributes.
    VTSI_EVENT_LISTENER_START_FAILED = 301;

    // A listener was stopped (<code>StopListener</code>, <code>StopListeners</code>). No attributes.
    VTSI_EVENT_LISTENER_STOPPED = 302;

    // A listener was deleted. No attributes.
    VTSI_EVENT_LISTENER_DELETED = 303;

    // A listener&apos;s container was restarted by the server. Attribute <code>container_name</code>; sets
    // <code>call_name</code>.
    VTSI_EVENT_LISTENER_RESTARTED = 304;

    // A listener&apos;s container was found not running or unhealthy. Attribute <code>container_name</code>;
    // <code>description</code> as for <code>VTSI_EVENT_CALLER_UNHEALTHY</code>.
    VTSI_EVENT_LISTENER_UNHEALTHY = 305;

    // A listener reported unhealthy is healthy again (its container answers its health check, or
    // its restart succeeded). Best effort: reported by the replica that reported it unhealthy. No
    // attributes.
    VTSI_EVENT_LISTENER_HEALTHY = 306;

    // The stored configuration of a listener was updated (<code>UpdateListener</code>,
    // <code>UpdateListeners</code>); its running container is unchanged. Attribute
    // <code>updated_fields</code>. Never carries a configuration value.
    VTSI_EVENT_LISTENER_UPDATED = 307;

    // ---- Scheduled callers (resource_name: the scheduled caller) ----

    // A scheduled caller was created. Attribute <code>scheduled_time</code> (RFC 3339). Sets
    // <code>campaign_name</code> for a scheduled call of a campaign.
    VTSI_EVENT_SCHEDULED_CALLER_CREATED = 400;

    // A scheduled caller fired: its call was started (<code>call_name</code> set). Attributes: outside a
    // campaign <code>attempt</code> (the attempt number); in a campaign <code>attempt_number</code> and
    // <code>campaign_call_name</code> (and <code>campaign_name</code> is set).
    VTSI_EVENT_SCHEDULED_CALLER_FIRED = 401;

    // A scheduled caller failed for good; <code>description</code> says why. Attributes: outside a campaign
    // <code>attempt</code> and <code>reason</code> (a classification token, e.g.
    // <code>transient_grpc:unavailable</code>, <code>configuration_error</code>, optionally suffixed
    // <code>:attempt_budget_exhausted</code>); in a campaign <code>attempt_number</code> and
    // <code>campaign_call_name</code>.
    VTSI_EVENT_SCHEDULED_CALLER_FAILED = 402;

    // A scheduled caller was cancelled. No attributes.
    VTSI_EVENT_SCHEDULED_CALLER_CANCELLED = 403;

    // A scheduled caller failed and will be retried. Attributes: outside a campaign <code>attempt</code>,
    // <code>reason</code> and <code>retry_not_before</code> (RFC 3339); in a campaign
    // <code>attempt_number</code> and <code>campaign_call_name</code>.
    VTSI_EVENT_SCHEDULED_CALLER_RETRY_SCHEDULED = 404;

    // A scheduled caller was updated: its stored configuration (an update RPC of scheduled callers, where
    // the server offers one) or, for a scheduled call of a campaign requeued by
    // <code>RetryCampaignCalls</code>, its status and scheduled time. Attribute <code>updated_fields</code>
    // (e.g. <code>status,scheduled_time</code>) and, when it changed, <code>scheduled_time</code> (RFC 3339);
    // in a campaign also <code>campaign_call_name</code> (and <code>campaign_name</code> is set). Never carries
    // a configuration value.
    VTSI_EVENT_SCHEDULED_CALLER_UPDATED = 405;

    // ---- Campaigns (resource_name: the campaign, or the campaign call for *_CALL_* events) ----
    // Every campaign event that is not a <code>*_CALL_*</code> event sets <code>campaign_name</code>,
    // <code>campaign_statistics</code> and <code>resource_sequence</code> (the campaign&apos;s state change
    // number).

    // A campaign was created (<code>CreateCampaign</code>, a <code>CampaignAssignment.new_campaign</code>,
    // <code>CloneCampaign</code>). No attributes, except for a clone: <code>cloned_from</code> (the source
    // campaign&apos;s resource name) and <code>copied_call_count</code>. An idempotent replay emits nothing.
    VTSI_EVENT_CAMPAIGN_CREATED = 500;

    // A campaign&apos;s settings were updated. Attribute <code>updated_fields</code> (the
    // <code>update_mask</code> paths). Never carries a call-default value.
    VTSI_EVENT_CAMPAIGN_UPDATED = 501;

    // A campaign was deleted. Attributes: <code>deleted_campaign_call_count</code>,
    // <code>cancelled_scheduled_caller_count</code>.
    VTSI_EVENT_CAMPAIGN_DELETED = 502;

    // A campaign was started. Attributes: <code>previous_state</code>, <code>state</code>; none when the
    // campaign was created running by a <code>CampaignAssignment</code>. <code>description</code> is
    // <code>calls were added</code> when adding calls started it.
    VTSI_EVENT_CAMPAIGN_STARTED = 503;

    // <code>StopCampaign</code> was requested; running calls continue. Attributes: <code>previous_state</code>,
    // <code>state</code>.
    VTSI_EVENT_CAMPAIGN_STOP_REQUESTED = 504;

    // A campaign is stopped: it reached <code>STOPPED</code> (after a stop request or an automatic
    // stop) once no call of it was running. Attributes: <code>state</code> and <code>display_name</code>
    // when the engine observed it; none (with <code>description</code> <code>no call of the campaign was in
    // flight</code>) when the stop request stopped it at once.
    VTSI_EVENT_CAMPAIGN_STOPPED = 505;

    // <code>HardStopCampaign</code> (or a forced <code>DeleteCampaign</code>) was requested. Attributes:
    // <code>previous_state</code>, <code>state</code>.
    VTSI_EVENT_CAMPAIGN_HARD_STOP_REQUESTED = 506;

    // A campaign is hard stopped. Attributes as <code>VTSI_EVENT_CAMPAIGN_STOPPED</code>.
    VTSI_EVENT_CAMPAIGN_HARD_STOPPED = 507;

    // A campaign was resumed (<code>ResumeCampaign</code>, or a <code>COMPLETED</code> campaign that got calls
    // back from a <code>CampaignAssignment</code> or <code>RetryCampaignCalls</code>). Attributes:
    // <code>previous_state</code>, <code>state</code>; <code>description</code> says what resumed it when it
    // was not <code>ResumeCampaign</code>.
    VTSI_EVENT_CAMPAIGN_RESUMED = 508;

    // Every call of a campaign is finished. Attributes: <code>state</code>, <code>display_name</code>;
    // <code>description</code> is the <code>state_reason</code>.
    VTSI_EVENT_CAMPAIGN_COMPLETED = 509;

    // The statistics of a running campaign changed (throttled, at most once per
    // <code>ONDEWO_VTSI_CAMPAIGN_PROGRESS_EVENT_MIN_INTERVAL_S</code>, 5 s by default, per campaign).
    // <code>campaign_statistics</code> is set. Attributes: <code>state</code>, <code>display_name</code>.
    VTSI_EVENT_CAMPAIGN_PROGRESS = 510;

    // <code>max_parallel_calls</code> changed; attributes <code>previous_max_parallel_calls</code>
    // and <code>max_parallel_calls</code>.
    VTSI_EVENT_CAMPAIGN_MAX_PARALLEL_CALLS_CHANGED = 511;

    // Calls were added to a campaign (an <code>Add*ToCampaign</code> request, or <code>CloneCampaign</code>
    // with <code>include_calls</code>); attribute <code>added_call_count</code>.
    VTSI_EVENT_CAMPAIGN_CALLS_ADDED = 512;

    // An attempt of a campaign call was started (<code>call_name</code> set). Campaign call attributes.
    VTSI_EVENT_CAMPAIGN_CALL_DISPATCHED = 513;

    // A campaign call completed. Campaign call attributes.
    VTSI_EVENT_CAMPAIGN_CALL_COMPLETED = 514;

    // A campaign call failed after its last attempt. Campaign call attributes; <code>description</code> is
    // the error.
    VTSI_EVENT_CAMPAIGN_CALL_FAILED = 515;

    // An attempt of a campaign call failed and the call will be retried. Campaign call attributes;
    // <code>description</code> is the error.
    VTSI_EVENT_CAMPAIGN_CALL_RETRY_SCHEDULED = 516;

    // A campaign call was cancelled (hard stop, cancelled scheduled caller, or
    // <code>CancelCampaignCalls</code>). Campaign call attributes; <code>description</code> says what cancelled
    // it.
    VTSI_EVENT_CAMPAIGN_CALL_CANCELLED = 517;

    // The SERVER stopped a campaign (it is now <code>STOPPING</code>) after repeated failures that
    // cannot succeed by repetition, e.g. a rejected credential; <code>description</code> holds the
    // <code>state_reason</code>. <code>VTSI_EVENT_CAMPAIGN_STOPPED</code> follows once no call runs.
    // Attributes: <code>state</code> (<code>STOPPING</code>), <code>display_name</code>.
    VTSI_EVENT_CAMPAIGN_AUTO_STOPPED = 518;

    // A FAILED or CANCELLED campaign call was put back into the queue by <code>RetryCampaignCalls</code>.
    // Campaign call attributes, plus <code>attempt_limit</code> (the call&apos;s new attempt limit) and, for a
    // call now <code>RETRY_PENDING</code>, <code>next_attempt_time</code> (RFC 3339).
    VTSI_EVENT_CAMPAIGN_CALL_REQUEUED = 519;

    // A RUNNING campaign with a <code>calling_window</code> entered a slot and may start calls again (also when
    // it is started or resumed inside a slot after having been outside one, and when an update of the window
    // opens it). Attributes: <code>state</code>, <code>display_name</code>, <code>window_end</code> (RFC 3339,
    // when the current run of slots ends). Best effort, at most one per edge, reported by the replica whose
    // engine ticked the campaign.
    VTSI_EVENT_CAMPAIGN_CALLING_WINDOW_OPENED = 520;

    // A RUNNING campaign with a <code>calling_window</code> left its last slot and starts no call until the next
    // one (also when it is started, or its window updated, outside every slot). Running calls continue.
    // Attributes: <code>state</code>, <code>display_name</code>, <code>next_window_start</code> (RFC 3339).
    // Best effort, at most one per edge.
    VTSI_EVENT_CAMPAIGN_CALLING_WINDOW_CLOSED = 521;

    // ---- VTSI projects (resource_name: the project) ----

    // 600 was "project created". No subscription can exist before its project, so that event could
    // never be delivered; it is not part of the API.
    reserved 600;
    reserved "VTSI_EVENT_VTSI_PROJECT_CREATED";

    // A VTSI project was updated. No attributes.
    VTSI_EVENT_VTSI_PROJECT_UPDATED = 601;

    // A VTSI project was deleted. Delivered to the webhooks subscribed to it at the moment of the
    // deletion (their configuration is captured before it is deleted with the project) and to the
    // project&apos;s open streams, which then end. It is the last event of the project. No attributes.
    VTSI_EVENT_VTSI_PROJECT_DELETED = 602;

    // A VTSI project was deployed. No attributes.
    VTSI_EVENT_VTSI_PROJECT_DEPLOYED = 603;

    // Deploying a VTSI project failed; <code>description</code> says why. No attributes.
    VTSI_EVENT_VTSI_PROJECT_DEPLOY_FAILED = 604;

    // A VTSI project was undeployed. No attributes.
    VTSI_EVENT_VTSI_PROJECT_UNDEPLOYED = 605;

    // The <code>VtsiProjectStatus</code> of a project changed; attributes
    // <code>previous_status</code> and <code>status</code>, each a <code>VtsiProjectStatus</code> name
    // (<code>DEPLOYED</code>, <code>UPDATING</code>, ...).
    VTSI_EVENT_VTSI_PROJECT_STATUS_CHANGED = 606;

    // Undeploying a VTSI project failed; <code>description</code> says why. No attributes.
    VTSI_EVENT_VTSI_PROJECT_UNDEPLOY_FAILED = 607;

    // ---- Asterisk (resource_name: the project; attribute container_name) ----

    // The project&apos;s Asterisk container was deployed. Attribute <code>container_name</code>.
    VTSI_EVENT_ASTERISK_DEPLOYED = 700;

    // The project&apos;s Asterisk container was removed. Attribute <code>container_name</code>.
    VTSI_EVENT_ASTERISK_REMOVED = 701;

    // The project&apos;s Asterisk was restarted. Attribute <code>restart_reason</code> (<code>plan</code> or
    // <code>escalation</code>).
    VTSI_EVENT_ASTERISK_RESTARTED = 702;

    // The project&apos;s Asterisk configuration was reloaded in place. Attribute <code>container_name</code>.
    VTSI_EVENT_ASTERISK_CONFIG_RELOADED = 703;

    // The project&apos;s Asterisk container is not running or unhealthy. Attribute
    // <code>container_name</code>.
    VTSI_EVENT_ASTERISK_UNHEALTHY = 704;

    // The project&apos;s Asterisk container is healthy again. Attribute <code>container_name</code>.
    VTSI_EVENT_ASTERISK_HEALTHY = 705;

    // The SIP trunk registered with the carrier. Attribute <code>container_name</code>.
    VTSI_EVENT_ASTERISK_TRUNK_REGISTERED = 706;

    // The SIP trunk is no longer registered (rejected, unregistered or failed); attributes
    // <code>container_name</code> and <code>registration_status</code> (Asterisk&apos;s own token, e.g.
    // <code>Rejected</code>, <code>Unregistered</code>, <code>Unknown</code>).
    VTSI_EVENT_ASTERISK_TRUNK_UNREGISTERED = 707;

    // Deploying the project&apos;s Asterisk container failed; <code>description</code> says why. Attribute
    // <code>container_name</code>.
    VTSI_EVENT_ASTERISK_DEPLOY_FAILED = 708;

    // Restarting the project&apos;s Asterisk failed; <code>description</code> says why. Attribute
    // <code>restart_reason</code>.
    VTSI_EVENT_ASTERISK_RESTART_FAILED = 709;

    // Reloading the project&apos;s Asterisk configuration in place failed; <code>description</code>
    // says why. Attribute <code>container_name</code>.
    VTSI_EVENT_ASTERISK_CONFIG_RELOAD_FAILED = 710;

    // ---- Softphone accounts (resource_name: the softphone account) ----

    // A softphone account was created. No attributes.
    VTSI_EVENT_SOFTPHONE_ACCOUNT_CREATED = 800;

    // A softphone account was updated. Attribute <code>updated_fields</code>.
    VTSI_EVENT_SOFTPHONE_ACCOUNT_UPDATED = 801;

    // A softphone account was deleted. Attribute <code>revoked_certificate_count</code>.
    VTSI_EVENT_SOFTPHONE_ACCOUNT_DELETED = 802;

    // The credentials of a softphone account were rotated. Attribute <code>certificate_rotated</code>
    // (boolean).
    VTSI_EVENT_SOFTPHONE_CREDENTIALS_ROTATED = 803;

    // A softphone certificate was revoked (resource_name: the certificate). Attribute
    // <code>account_locked</code> (boolean).
    VTSI_EVENT_SOFTPHONE_CERTIFICATE_REVOKED = 804;

    // ---- Event system ----

    // Sent by <code>TestWebhook</code> only (when it names no <code>sample_event</code>). No attributes;
    // <code>description</code> is <code>webhook test</code>.
    VTSI_EVENT_WEBHOOK_TEST = 900;

    // A webhook was created (resource_name: the webhook). Never carries a header value or the signing
    // secret. No attributes.
    VTSI_EVENT_WEBHOOK_CREATED = 901;

    // A webhook was updated; attribute <code>updated_fields</code> (the mask paths). Never carries
    // a header value or the signing secret.
    VTSI_EVENT_WEBHOOK_UPDATED = 902;

    // A webhook was deleted. No attributes.
    VTSI_EVENT_WEBHOOK_DELETED = 903;

    // An event subscription was created (resource_name: the subscription). No attributes.
    VTSI_EVENT_EVENT_SUBSCRIPTION_CREATED = 904;

    // An event subscription was updated; attribute <code>updated_fields</code>.
    VTSI_EVENT_EVENT_SUBSCRIPTION_UPDATED = 905;

    // An event subscription was deleted. No attributes.
    VTSI_EVENT_EVENT_SUBSCRIPTION_DELETED = 906;
}

// HTTP method of a webhook request.
// <p>Note: the zero value <code>WEBHOOK_HTTP_METHOD_UNSPECIFIED</code> is not "no method" but means
// <code>POST</code>, the default. It keeps its released name for wire and source compatibility; a webhook
// written with it is stored and sent as POST, and <code>Webhook.http_method</code> then reads back
// <code>WEBHOOK_HTTP_METHOD_POST</code>.</p>
enum WebhookHttpMethod {

    // Unspecified: <code>POST</code>.
    WEBHOOK_HTTP_METHOD_UNSPECIFIED = 0;

    // POST.
    WEBHOOK_HTTP_METHOD_POST = 1;

    // PUT.
    WEBHOOK_HTTP_METHOD_PUT = 2;
}

//////////////////////////////////////////////////////////////////////////////
// Resources
//////////////////////////////////////////////////////////////////////////////

// One event. This is the body of a webhook request (proto3 JSON with the original field names)
// and the unit of the <code>SubscribeVtsiEvents</code> stream.
message VtsiEventMessage {

    // Unique id of the event (uuid). A retried webhook request carries the same id, and a call
    // status change observed by several server replicas carries one id, so it identifies a
    // duplicate.
    string event_id = 1;

    // The event.
    VtsiEvent event = 2;

    // VTSI project of the event.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 3;

    // The resource the event is about (call, caller, listener, scheduled caller, campaign, campaign
    // call, project, softphone account).
    string resource_name = 4;

    // When the event happened.
    google.protobuf.Timestamp event_time = 5;

    // SIP status after the change, for call and campaign call events.
    optional ondewo.sip.SipStatus.StatusType sip_status_type = 6;

    // SIP status description, where the event has one.
    string sip_status_description = 7;

    // SIP status before the change, for <code>VTSI_EVENT_CALL_SIP_STATUS_CHANGED</code>.
    optional ondewo.sip.SipStatus.StatusType previous_sip_status_type = 8;

    // The call the event is about or produced, where there is one.
    string call_name = 9;

    // The campaign the event belongs to, where known.
    string campaign_name = 10;

    // Human-readable description, e.g. why something failed.
    string description = 11;

    // Further event-specific values, e.g. <code>caller_name</code>, <code>listener_name</code>,
    // <code>phone_number</code>, <code>container_name</code>, <code>attempt_number</code>,
    // <code>previous_status</code>. The keys and value formats of each event are documented at its
    // <a href="index.html#ondewo.vtsi.VtsiEvent">VtsiEvent</a> value; at most 20 entries, each value at most
    // 256 characters. Receivers must ignore keys they do not know: later versions may add keys.
    map<string, string> attributes = 12;

    // Statistics of the campaign, on campaign events.
    CampaignStatistics campaign_statistics = 13;

    // Increases with every change of <code>resource_name</code> that produced an event, so a
    // receiver can order events of one resource that arrived out of order. Defined (&gt; 0) for
    // call events (the call&apos;s status change number), campaign call events and campaign state
    // events; <code>0</code> where the resource has no such counter, then order by
    // <code>event_time</code>.
    int64 resource_sequence = 14;
}

// Which events of a project are delivered to which webhooks.
message VtsiEventSubscription {

    // Output only. Resource name.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/event_subscriptions/&lt;subscription_uuid&gt;</code></pre>
    string name = 1;

    // Output only. VTSI project of the subscription.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 2;

    // Human-readable name, at most 128 characters. NOT unique within the project; may be empty, and an
    // empty display name stays empty (no default is generated). Updatable.
    string display_name = 3;

    // The events to deliver. Required unless <code>all_events</code> is set; must be empty when it
    // is. At most one entry per value (duplicates are ignored). Updatable.
    repeated VtsiEvent events = 4;

    // Deliver every event, including events added in later versions, except
    // <code>excluded_events</code>. Updatable.
    bool all_events = 5;

    // Deliver only events whose <code>resource_name</code> starts with one of these prefixes, e.g.
    // a caller name (<code>projects/&lt;p&gt;/callers/&lt;c&gt;</code> also selects that
    // caller&apos;s calls) or a campaign name (selects the campaign and its campaign calls, NOT the
    // calls a campaign placed, whose resource names are under <code>callers/</code>; use
    // <code>campaign_names</code> for those). Empty means every resource of the project. At most
    // 50. Updatable.
    repeated string resource_name_prefixes = 6;

    // Webhooks of the same project the events are sent to. Empty means none (the subscription is
    // then only useful to <code>SubscribeVtsiEvents</code>). At most 20. Updatable.
    repeated string webhook_names = 7;

    // <code>false</code> (the default): events are delivered. <code>true</code>: nothing is
    // delivered and <code>SubscribeVtsiEvents</code> refuses the subscription. Updatable.
    bool disabled = 8;

    // Output only. The user who created the subscription.
    string created_by = 9;

    // Output only. Creation time.
    google.protobuf.Timestamp created_at = 10;

    // Output only. The user who last modified the subscription.
    string modified_by = 11;

    // Output only. Last modification time.
    google.protobuf.Timestamp modified_at = 12;

    // Deliver only events whose <code>campaign_name</code> is one of these campaign resource names:
    // the campaign&apos;s own events, its campaign call events and the call, caller and scheduled
    // caller events of the calls it placed. Call events produced while a campaign attempt is being
    // started (<code>CALL_CREATED</code>, <code>CALL_INITIATED</code>) can lack the campaign and are
    // then not matched; <code>VTSI_EVENT_CAMPAIGN_CALL_DISPATCHED</code> always carries both
    // <code>campaign_name</code> and <code>call_name</code>. Empty means no constraint. Combined with
    // <code>resource_name_prefixes</code> by AND. At most 50. Updatable.
    repeated string campaign_names = 13;

    // Events NOT to deliver, subtracted from the selection of <code>events</code> / <code>all_events</code>,
    // e.g. <code>all_events</code> with <code>VTSI_EVENT_CALL_SIP_STATUS_CHANGED</code> and
    // <code>VTSI_EVENT_CAMPAIGN_PROGRESS</code> excluded. Empty means nothing is excluded.
    // <code>VTSI_EVENT_UNSPECIFIED</code>, a reserved value, or a value that is also in <code>events</code>
    // is rejected with <code>INVALID_ARGUMENT</code>. At most 100 entries. Updatable (path
    // <code>excluded_events</code>, replaced whole).
    repeated VtsiEvent excluded_events = 14;
}

// Delivery counters of a webhook. Approximate: summed over every server replica and flushed every
// few seconds.
message WebhookDeliveryStatistics {

    // Requests answered with a 2xx status.
    int64 delivered_count = 1;

    // Events given up after the last retry.
    int64 failed_count = 2;

    // Events dropped without a request because the server&apos;s webhook queue was full, or because
    // the webhook&apos;s circuit was open after repeated failures.
    int64 dropped_count = 3;

    // Time of the last request.
    google.protobuf.Timestamp last_delivery_time = 4;

    // Time of the last 2xx answer.
    google.protobuf.Timestamp last_success_time = 5;

    // HTTP status of the last answer, 0 when no answer was received.
    int32 last_http_status_code = 6;

    // Why the last request failed, e.g. <code>timeout</code>, <code>connection_error</code>,
    // <code>http_503</code>. Never contains a header value or a URL query.
    string last_error = 7;
}

// An HTTP(S) endpoint that receives one request per event.
message Webhook {

    // Output only. Resource name.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/webhooks/&lt;webhook_uuid&gt;</code></pre>
    string name = 1;

    // Output only. VTSI project of the webhook.
    // The format is: <pre><code>projects/&lt;project_uuid&gt;/project</code></pre>
    string vtsi_project_name = 2;

    // Human-readable name, at most 128 characters. NOT unique within the project; may be empty, and an
    // empty display name stays empty (no default is generated). Updatable.
    string display_name = 3;

    // Required. http:// or https:// URL, at most 2048 characters, without user information. Any
    // host is allowed. Updatable.
    string url = 4;

    // HTTP method. Unset means POST. Updatable.
    WebhookHttpMethod http_method = 5;

    // Optional extra request headers, e.g. <code>Authorization</code>. WRITE-ONLY VALUES: every RPC
    // returns each value as <code>********</code>. At most 20 headers; names are HTTP tokens of at
    // most 128 characters; values at most 4096 characters without line breaks. Reserved and refused:
    // <code>Host</code>, <code>Content-Length</code>, <code>Content-Type</code>,
    // <code>Transfer-Encoding</code>, <code>Connection</code> and every <code>X-Ondewo-Vtsi-*</code>
    // name. Updatable (see <code>UpdateWebhook</code> for the mask value and for moving the url to
    // another origin).
    map<string, string> custom_headers = 6;

    // <code>false</code> (the default): events are sent. <code>true</code>: nothing is sent (except
    // by <code>TestWebhook</code>). Updatable.
    bool disabled = 7;

    // Request timeout. Unset means the server default (5 s); allowed 1 s to 30 s. Updatable.
    google.protobuf.Duration timeout = 8;

    // Output only. Delivery counters.
    WebhookDeliveryStatistics delivery_statistics = 9;

    // Output only. The user who created the webhook.
    string created_by = 10;

    // Output only. Creation time.
    google.protobuf.Timestamp created_at = 11;

    // Output only. The user who last modified the webhook.
    string modified_by = 12;

    // Output only. Last modification time.
    google.protobuf.Timestamp modified_at = 13;

    // Optional. Secret with which the server SIGNS every request to this webhook, so the receiver can verify
    // that a request comes from this VTSI server and was not changed. WRITE-ONLY: every RPC returns
    // <code>********</code> when a secret is stored and an empty string when none is; it is never logged and
    // never put on an event. 32 to 256 printable ASCII characters without whitespace (generate at least
    // 32 random characters); anything else, and the mask value itself on create, is rejected with
    // <code>INVALID_ARGUMENT</code>. Empty (the default) means requests are not signed.
    // <p>Signature: each request carries the header</p>
    // <pre><code>X-Ondewo-Vtsi-Signature: t=&lt;unix seconds&gt;,v1=&lt;signature&gt;</code></pre>
    // <p>where <code>t</code> is the time the request was sent (base-10 seconds since the Unix epoch, a new
    // value for every attempt) and the signature is the lowercase hex HMAC-SHA256, keyed with the secret&apos;s
    // bytes, of the ASCII string <code>&lt;t&gt;.</code> followed by the exact bytes of the request body:</p>
    // <pre><code>v1 = hex(HMAC_SHA256(key = signing_secret, message = t + "." + body))</code></pre>
    // <p>To verify: recompute it over the raw body as received (before any JSON parsing), compare in constant
    // time with each <code>v1</code> value of the header (there can be two, see rotation), and reject the
    // request when none matches or when <code>t</code> is more than 5 minutes away from the receiver&apos;s
    // clock (replay protection; de-duplicate by <code>event_id</code> as well). Further signature schemes may
    // be added later as additional comma-separated <code>v&lt;n&gt;=</code> entries: ignore entries you do not
    // know.</p>
    // <p>Rotation: <code>UpdateWebhook</code> with <code>update_mask</code> path <code>signing_secret</code>
    // and the new value. For <code>ONDEWO_VTSI_WEBHOOK_SIGNING_ROTATION_GRACE_S</code> (24 h by default) after
    // a rotation every request carries two signatures, <code>t=...,v1=&lt;new&gt;,v1=&lt;previous&gt;</code>,
    // so the receiver can switch to the new secret at any time within that window; afterwards only the new
    // one. Writing an empty string removes signing at once (no grace); writing <code>********</code> keeps the
    // stored secret, so a Get-modify-Update round trip does not change it. <code>TestWebhook</code> signs like
    // a real delivery and is the way to check a receiver&apos;s verification before relying on it.</p>
    string signing_secret = 14;
}

// Selects events for <code>SubscribeVtsiEvents</code> without a stored subscription, and narrows a
// <code>RedeliverWebhookEvents</code> window. Every set field narrows the selection (AND); the entries of one
// list are alternatives (OR).
message VtsiEventFilter {

    // Only these events. Empty means every event (unlike <code>VtsiEventSubscription.events</code>, where
    // empty is refused unless <code>all_events</code> is set: a filter is a one-off request, so "no
    // constraint" is its natural empty value). <code>VTSI_EVENT_UNSPECIFIED</code> or a reserved value is
    // rejected with <code>INVALID_ARGUMENT</code>.
    repeated VtsiEvent events = 1;

    // Only events whose <code>resource_name</code> starts with one of these prefixes. Empty means
    // every resource of the project. Same semantics as
    // <code>VtsiEventSubscription.resource_name_prefixes</code>.
    repeated string resource_name_prefixes = 2;

    // Only events of these campaigns. Same semantics as
    // <code>VtsiEventSubscription.campaign_names</code>.
    repeated string campaign_names = 3;

    // Every event, explicitly; equivalent to an empty <code>events</code> and present for symmetry with
    // <code>VtsiEventSubscription.all_events</code>. Set together with a non-empty <code>events</code> is
    // rejected with <code>INVALID_ARGUMENT</code>.
    bool all_events = 4;

    // Events NOT to select, subtracted from the selection of <code>events</code> / <code>all_events</code>.
    // Same semantics and limits as <code>VtsiEventSubscription.excluded_events</code>.
    repeated VtsiEvent excluded_events = 5;
}

