syntax = "proto3";

package ondewo.sip;
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// <p>ONDEWO-SIP API available at <a href="https://github.com/ondewo/ondewo-sip-api">GitHub</a></p>
service Sip {
    // <p>SIP LifeCycle is explained at <a href="https://thanhloi2603.wordpress.com/2017/06/10/sip-lifecycle-overview/">here</a></p>

    // <p>Starts a new SIP session for an account registered at a SIP server. <code>RegisterAccount</code> need to be called before.</p>
    rpc SipStartSession (SipStartSessionRequest) returns (SipStatus) {};

    // <p>Ends a SIP session for an account registered at a SIP server</p>
    rpc SipEndSession (google.protobuf.Empty) returns (SipStatus) {};

    // <p>Starts a call in an active SIP session for an account registered at a SIP server</p>
    rpc SipStartCall (SipStartCallRequest) returns (SipStatus) {};

    // <p>Ends a call in an active SIP session for an account registered at a SIP server</p>
    rpc SipEndCall (SipEndCallRequest) returns (SipStatus) {};

    // <p>Transfers a call in an active SIP session for an account registered at a SIP server to another SIP account or phone number specified by <code>transfer_id</code></p>
    rpc SipTransferCall (SipTransferCallRequest) returns (SipStatus) {};

    // <p>Registers s SIP account at a SIP server</p>
    rpc SipRegisterAccount (SipRegisterAccountRequest) returns (SipStatus) {};

    // <p>Gets the current SIP status</p>
    rpc SipGetSipStatus (google.protobuf.Empty) returns (SipStatus) {};

    // <p>Gets the history of SIP status</p>
    rpc SipGetSipStatusHistory (google.protobuf.Empty) returns (SipStatusHistoryResponse) {};

    // <p>Plays wav files during an ongoing call of an active SIP session</p>
    rpc SipPlayWavFiles (SipPlayWavFilesRequest) returns (SipStatus) {};

    // <p>Mutes the microphone in an ongoing call of an active SIP session</p>
    rpc SipMute (google.protobuf.Empty) returns (SipStatus) {};

    // <p>Un-mutes the microphone in an ongoing call of an active SIP session</p>
    rpc SipUnMute (google.protobuf.Empty) returns (SipStatus) {};
}

// <p>Ends an ongoing call of the active SIP session of the active SIP account</p>
message SipEndCallRequest{

    // Set to <code>True</code> to forcefully hang up the call
    bool hard_hangup = 1;

    // <p>Why the call is being ended</p>
    enum EndCallReason{

        // No specific reason given. The call ends as an ordinary hangup, exactly as before this field existed
        END_CALL_REASON_UNSPECIFIED = 0;

        // Answering machine detection decided the callee is not a person to talk to (answering machine, fax,
        // network announcement, ...) and ends the call. The terminal status of the call is then
        // <code>OUTGOING_CALL_ANSWERING_MACHINE</code> instead of <code>OUTGOING_CALL_FINISHED</code>
        ANSWERING_MACHINE = 1;
    }

    // Optional: reason for ending the call. Leave unset for an ordinary hangup
    EndCallReason end_reason = 2;

    // Optional: result of the answering machine detection that decided to end the call. Only meaningful together with
    // <code>end_reason = ANSWERING_MACHINE</code>; it is carried into <code>SipStatus.amd_result</code> of the
    // terminal status of the call
    AnsweringMachineDetectionResult amd_result = 3;
}

// <p>Result of the answering machine detection (AMD) of an outbound call</p>
// <p>Carries identifiers from closed vocabularies only: never audio, transcript text or a phone number</p>
message AnsweringMachineDetectionResult{

    // <p>Who or what answered the call</p>
    enum Verdict{

        // No verdict available
        VERDICT_UNSPECIFIED = 0;

        // A person answered the call
        HUMAN = 1;

        // An answering machine or voicemail answered the call
        MACHINE = 2;

        // An interactive voice response system (IVR) answered the call
        IVR = 3;

        // A fax machine answered the call
        FAX = 4;

        // A network announcement answered the call, e.g. "the number you have dialed is not available"
        NETWORK_ANNOUNCEMENT = 5;

        // A call screening service answered the call, e.g. asking the caller to state their name
        CALL_SCREENING = 6;

        // Nothing was said within the detection window
        NO_SPEECH = 7;

        // The detection could not decide
        UNKNOWN = 8;
    }

    // <p>Evidence that led to the verdict</p>
    enum Cause{

        // No cause available
        CAUSE_UNSPECIFIED = 0;

        // The speech cadence, e.g. a long uninterrupted greeting
        CADENCE = 1;

        // A keyword or phrase typical of the verdict
        KEYWORD = 2;

        // A voicemail beep
        BEEP = 3;

        // A tone, e.g. a fax or special information tone
        TONE = 4;

        // Both the speech cadence and a keyword
        CADENCE_AND_KEYWORD = 5;

        // Both the speech cadence and a voicemail beep
        CADENCE_AND_BEEP = 6;

        // The detection window ended before any other evidence decided
        TIMEOUT = 7;

        // Silence throughout the detection window
        SILENCE = 8;
    }

    // <p>What was done because of the verdict</p>
    enum ActionTaken{

        // No action recorded
        ACTION_TAKEN_UNSPECIFIED = 0;

        // The call was hung up
        HUNG_UP = 1;

        // The call continued as normal
        CONTINUED = 2;

        // Detection only: the verdict was recorded, but the call was not influenced by it
        DETECT_ONLY = 3;
    }

    // Who or what answered the call
    Verdict verdict = 1;

    // Evidence that led to the verdict
    Cause cause = 2;

    // Confidence of the verdict, between <code>0.0</code> and <code>1.0</code>
    float confidence = 3;

    // Time in milliseconds from the call being connected until the verdict was reached
    int32 decision_ms = 4;

    // Identifier of the detection rule that produced the verdict
    string rule_id = 5;

    // Identifiers of the cues that matched, e.g. keyword or tone identifiers. Identifiers only, never transcript text
    repeated string matched_cue_ids = 6;

    // What was done because of the verdict
    ActionTaken action_taken = 7;

    // Identifier of the call the result belongs to, i.e. the value of the <code>X-ondewo-vtsi-caller-call-id</code>
    // header of the call. Used to match a result to its call by identity rather than by recency
    string call_id = 8;
}

// <p>Request to start the call with the active SIP session of the active SIP account</p>
message SipStartCallRequest{

    // SIP account name
    string callee_id = 1;

    // Headers to include when starting the call
    map<string, string> headers = 2;
}

// <p>Request for registering a SIP account at a SIP server</p>
message SipRegisterAccountRequest{
    // Account name of the sip user. Usually something like <code>sip-user-1@mydomain.com</code> or <code>sip-user-1@192.168.123.123</code> which uses the default SIP port <code>5060</code>.
    // Also a non-default SIP port can be specified via <code>sip-user-1@mydomain.com:5099</code> to connect to a SIP server running on port <code>5099</code>
    string account_name = 1;

    // Password of the account
    string password = 2;

    // Optional: authentication user name
    string auth_username = 3;

    // Optional: outbound proxy address, e.g. <code>my.outbound.proxy.com</code>
    string outbound_proxy = 4;
}

// <p>Request for starting a new SIP session for a specified account</p>
message SipStartSessionRequest{
    // Account name of the sip user. Usually something like <code>sip-user-1@mydomain.com</code> or <code>sip-user-1@192.168.123.123</code> which uses the default SIP port <code>5060</code>.
    // Also a non-default SIP port can be specified via <code>sip-user-1@mydomain.com:5099</code> to connect to a SIP server running on port <code>5099</code>
    string account_name = 1;

    // Auto-answer interval in seconds. The call will be automatically answered after this interval
    int32 auto_answer_interval = 2;
}

// <p>Request for transferring a call with or without headers</p>
message SipTransferCallRequest{
    // The account name or phone number to transfer the call to
    string transfer_id = 1;

    // The headers to include when transferring the call
    map<string, string> headers = 2;
}

// <p>Status information for a SIP account, session, or call</p>
message SipStatus{
    // Account name of the sip user. Usually something like <code>sip-user-1@mydomain.com</code> or <code>sip-user-1@192.168.123.123</code> which uses the default SIP port <code>5060</code>.
    // Also a non-default SIP port can be specified via <code>sip-user-1@mydomain.com:5099</code> to connect to a SIP server running on port <code>5099</code>
    string account_name = 1;

    // Timestamp of the status
    google.protobuf.Timestamp timestamp = 2;

    // Types of status
    enum StatusType{

        // No session is currently active
        NO_SESSION = 0;

        // SIP account is registered at a SIP server
        REGISTERED = 1;

        // SIP account is ready to call
        READY = 2;

        // SIP account is being called, i.e. inbound/incoming call
        INCOMING_CALL_INITIATED = 3;

        // SIP account starts calling, i.e. outbound/outgoing call
        OUTGOING_CALL_INITIATED = 4;

        // SIP account outbound call is connected
        OUTGOING_CALL_CONNECTED = 5;

        // SIP account incoming call is connected
        INCOMING_CALL_CONNECTED = 6;

        // SIP account starts transferring the call
        TRANSFER_CALL_INITIATED = 7;

        // SIP account hangs up the ongoing call
        SOFT_HANGUP_INITIATED = 8;

        // SIP account forcefully hangs up by terminating the SIP program
        HARD_HANGUP_INITIATED = 9;

        // SIP account cannot accept the incoming call
        INCOMING_CALL_FAILED = 10;

        // SIP account cannot do an outbound call
        OUTGOING_CALL_FAILED = 11;

        // SIP account finished the ongoing incoming call
        INCOMING_CALL_FINISHED = 12;

        // SIP account finished the ongoing outgoing call
        OUTGOING_CALL_FINISHED = 13;

        // Registration of SIP account to SIP server failed
        SESSION_REGISTRATION_FAILED = 14;

        // SIP account started a new SIP session via a SIP server
        SESSION_STARTED = 15;

        // SIP account ended active sip session with SIP server
        SESSION_ENDED = 16;

        // SIP account cannot transfer the call
        TRANSFER_CALL_FAILED = 17;

        // Microphone is muted
        MICROPHONE_MUTED = 18;

        // Microphone is unmuted
        MICROPHONE_UNMUTED = 19;

        // Microphone has played wav files
        MICROPHONE_WAV_FILES_PLAYED = 20;

        // No ongoing call
        NO_ONGOING_CALL = 21;

        // SIP account ended the ongoing outgoing call because answering machine detection decided the callee is not
        // a person to talk to. Terminal, like <code>OUTGOING_CALL_FINISHED</code>; <code>amd_result.verdict</code>
        // tells an answering machine, a fax, a network announcement, ... apart
        OUTGOING_CALL_ANSWERING_MACHINE = 22;

    }

    // Status type
    StatusType status_type = 3;

    // SIP account name
    string callee_id = 4;

    // SIP account of the transfer
    string transfer_call_id = 5;

    // Headers to include when calling outbound or transfer
    map<string, string> headers = 6;

    // More detailed description of the status
    string description = 7;

    // Name of the exception
    string exception_name = 8;

    // Traceback of the exception
    string exception_traceback = 9;

    // session name of the NLU session
    string nlu_session_name = 10;

    // Result of the answering machine detection of the call. Set on the terminal status of every call on which
    // answering machine detection ran, including a <code>HUMAN</code> verdict; unset otherwise
    AnsweringMachineDetectionResult amd_result = 11;

}

// <p>History of SIP status</p>
message SipStatusHistoryResponse{

    // History of SIP status
    repeated SipStatus status_history = 1;
}

// <p>Plays a list of wav files</p>
message SipPlayWavFilesRequest{

    // Wav files as bytes in a list that will be played
    repeated bytes wav_files = 1;
}
